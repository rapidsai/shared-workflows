---
# Copyright (c) 2025, NVIDIA CORPORATION.

ci:
  autoupdate_schedule: 'monthly'
  skip: [actionlint-docker]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        files: ^(tests/test_((maven_http|conda_upload|container_upload)_contract|hosted_oci_preparation|guarded_oci_transport|four_family_rehearsal|four_family_plan_contract)\.py|ci/((conda|container)-publish/local_rehearsal|container-publish/(hosted_preparation|guarded_oci_transport))\.py|ci/publication-rehearsal/[^/]+\.py)$
        args: ['--select=E,F,B', '--ignore=E501']
      - id: ruff-format
        files: ^(tests/test_((maven_http|conda_upload|container_upload)_contract|hosted_oci_preparation|guarded_oci_transport|four_family_rehearsal|four_family_plan_contract)\.py|ci/((conda|container)-publish/local_rehearsal|container-publish/(hosted_preparation|guarded_oci_transport))\.py|ci/publication-rehearsal/[^/]+\.py)$
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.2
    hooks:
      - id: bandit
        files: ^(tests/test_((maven_http|conda_upload|container_upload)_contract|hosted_oci_preparation|guarded_oci_transport|four_family_rehearsal|four_family_plan_contract)\.py|ci/((conda|container)-publish/local_rehearsal|container-publish/(hosted_preparation|guarded_oci_transport))\.py|ci/publication-rehearsal/[^/]+\.py)$
        args: [--skip, B101]
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: Publication contract bugbear checks without Ruff equivalents
        files: ^(tests/test_((maven_http|conda_upload|container_upload)_contract|hosted_oci_preparation|guarded_oci_transport|four_family_rehearsal|four_family_plan_contract)\.py|ci/((conda|container)-publish/local_rehearsal|container-publish/(hosted_preparation|guarded_oci_transport))\.py|ci/publication-rehearsal/[^/]+\.py)$
        additional_dependencies: [flake8-bugbear==25.10.21]
        args: ['--select=B001,B036,B040,B042']
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(\.github/actions/select-candidate-version/select\.sh|ci/maven-publish/.*\.sh|tests/(candidate-workflow-contracts|select-candidate-version)\.sh)$
  - repo: https://github.com/rapidsai/pre-commit-hooks
    rev: v1.6.1
    hooks:
      - id: verify-copyright
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        additional_dependencies: [pyyaml]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        exclude: |
          (?x)^(
            .github/workflows/build-in-devcontainer.yaml
          )$
  - repo: local
    hooks:
      - id: four-family-rehearsal
        name: four-family actual local publication rehearsal
        entry: python -B -m pytest -q tests/test_four_family_rehearsal.py tests/test_four_family_plan_contract.py
        language: python
        additional_dependencies: [pytest==8.4.2, anaconda-client==1.15.0, requests==2.34.2, pip==26.2.1, tenacity==9.2.1, rich==15.0.0, click==8.5.0, pyyaml==6.0.3, packaging==26.3]
        pass_filenames: false
        always_run: true
      - id: container-upload-contract
        name: real authenticated registry and Docker contract
        entry: python -B -m pytest -q tests/test_container_upload_contract.py tests/test_hosted_oci_preparation.py tests/test_guarded_oci_transport.py
        language: python
        additional_dependencies: [pytest==8.4.2, requests==2.34.2]
        pass_filenames: false
        always_run: true
      - id: conda-upload-contract
        name: real Anaconda client loopback contract
        entry: python -m pytest -q tests/test_conda_upload_contract.py
        language: python
        additional_dependencies: [pytest==8.4.2, anaconda-client==1.15.0]
        pass_filenames: false
        always_run: true
      - id: maven-publish-steps
        name: Maven publish baseline steps
        entry: bash ci/maven-publish/test_maven_publish_steps.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: maven-publish-integration
        name: Maven publish baseline integration
        entry: bash ci/maven-publish/test_maven_central_publish_integration.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: maven-http-contract
        name: real Maven HTTP client loopback contract
        entry: python -m pytest -q tests/test_maven_http_contract.py
        language: python
        additional_dependencies: [pytest==8.4.2]
        pass_filenames: false
        always_run: true
      - id: candidate-workflow-contracts
        name: candidate workflow contracts
        entry: bash tests/candidate-workflow-contracts.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: prepare-matrix-dispatch-pins
        name: prepare matrix dispatch pin validation
        entry: bash tests/prepare-matrix-dispatch-pins.sh
        language: system
        pass_filenames: false
        always_run: true
