ci:
  autoupdate_schedule: 'monthly'
  skip: [actionlint-docker]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^ci/(maven-publish/.*|test_candidate_inputs)\.sh$
  - repo: https://github.com/rapidsai/pre-commit-hooks
    rev: v1.6.1
    hooks:
      - id: verify-copyright
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        additional_dependencies: [pyyaml]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        exclude: |
          (?x)^(
            .github/workflows/build-in-devcontainer.yaml
          )$

  - repo: local
    hooks:
      - id: candidate-input-contract
        name: test candidate image admission and scoped producer wiring
        entry: bash ci/test_candidate_inputs.sh
        language: system
        pass_filenames: false
        files: ^(ci/test_candidate_inputs\.sh|\.github/workflows/(conda-cpp-build|conda-python-build|wheels-build|custom-job)\.yaml)$
