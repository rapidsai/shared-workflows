name: Evaluate build policy
description: Evaluate build routing and credential/publication guards without credentials or source checkout.
inputs:
  inputs-json:
    description: The caller's workflow inputs as JSON.
    required: true
  build-type:
    description: Fixed build type for an internal candidate workflow.
    default: ''
  custom-job:
    description: Apply the package-only pilot's custom documentation opt-in.
    default: 'false'
  validate-inputs:
    description: Reject unsupported build types and non-default candidate options on CI builds.
    default: 'false'
  candidate-defaults-json:
    description: Candidate option defaults declared by the public entry point.
    default: '{}'
outputs:
  run-ci:
    description: The ordinary CI implementation should run.
    value: ${{ steps.evaluate.outputs.run-ci }}
  run-candidate:
    description: The candidate implementation should run.
    value: ${{ steps.evaluate.outputs.run-candidate }}
  allow-general-ci:
    description: The general CI role and distributed compiler cache are allowed.
    value: ${{ steps.evaluate.outputs.allow-general-ci }}
  allow-publication:
    description: Public publication is allowed by the candidate and ref guards.
    value: ${{ steps.evaluate.outputs.allow-publication }}
  image-preflight:
    description: At least one candidate image preflight input was supplied.
    value: ${{ steps.evaluate.outputs.image-preflight }}
  caller-cache:
    description: Caller cache configuration was supplied.
    value: ${{ steps.evaluate.outputs.caller-cache }}
runs:
  using: composite
  steps:
    - name: Evaluate routing and boundary policy
      id: evaluate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BUILD_INPUTS_JSON: ${{ inputs.inputs-json }}
        BUILD_TYPE_OVERRIDE: ${{ inputs.build-type }}
        CUSTOM_JOB: ${{ inputs.custom-job }}
        VALIDATE_INPUTS: ${{ inputs.validate-inputs }}
        CANDIDATE_DEFAULTS_JSON: ${{ inputs.candidate-defaults-json }}
        DISPATCH_BUILD_TYPE: ${{ github.event.inputs.build_type }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        REF: ${{ github.ref }}
        HEAD_REF: ${{ github.head_ref }}
      run: bash "${ACTION_PATH}/evaluate.sh"
