name: Prepare Build Matrix
description: Output the raw build matrix with no filtering.

outputs:
  matrix:
    description: Build matrix.
    value: ${{ steps.prepare-matrix.outputs.matrix }}
  rapids-version:
    description: RAPIDS version.
    value: ${{ steps.prepare-rapids-version.outputs.rapids-version }}

runs:
  using: composite
  steps:
    - id: prepare-matrix
      name: Prepare Build Matrix
      shell: bash
      run: |
        (echo -n 'matrix='; yq -o json . ./shared-workflows/matrix.yaml | jq -c .) >> "$GITHUB_OUTPUT"
    - id: prepare-rapids-version
      name: Prepare RAPIDS version
      shell: bash
      run:
        (echo -n 'rapids-version='; cat ./shared-workflows/RAPIDS_VERSION) >> "$GITHUB_OUTPUT"
