on:
  workflow_call:
    inputs:
      docs-preview-urls:
        description: "JSON object of the form {project: url}"
        type: string
        required: true
      docs-project:
        description: "Which project's URL to link. Defaults to the repository name."
        type: string
        required: true
      sha:
        description: "Full git commit SHA to update check status for"
        type: string
        required: true

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  post-status:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post docs preview commit status
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.docs-project }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          URLS: ${{ inputs.docs-preview-urls }}
        run: |
          set -euo pipefail
          url=$(jq -r --arg p "${PROJECT}" '.[$p] // empty' <<< "${urls}")
          if [[ -z "${url:-}" ]]; then
            echo "::warning::No docs preview URL for project '${PROJECT}'. Available: $(jq -r 'keys | join(", ")' <<< "${urls}")"
            exit 0
          fi
          gh api --method POST "repos/${REPO}/statuses/${SHA}" \
            -f state=success \
            -f context="docs-preview" \
            -f description="${PROJECT} docs preview (NVIDIA VPN required)" \
            -f target_url="${url}"
          echo "- [${PROJECT} docs preview](${url})" >> "${GITHUB_STEP_SUMMARY}"
