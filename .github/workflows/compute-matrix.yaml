on:
  workflow_call:
    inputs:
      build_type:
        description: "One of: [branch, nightly, pull-request, release-candidate]"
        required: true
        type: string
      matrix_name:
        description: Name of the workflow matrix in prepare-matrix/matrix.yaml.
        required: true
        type: string
      matrix_type:
        description: Comma-separated matrix types, or auto to select by build_type.
        type: string
        default: auto
      matrix_filter:
        description: jq expression which modifies the matrix entry array.
        type: string
        default: "."
      resolved-matrix:
        description: Optional nonempty JSON include matrix. Reuses the caller's snapshot instead of resolving current definitions; matrix_filter still applies.
        type: string
        default: ''
      pure_wheel:
        description: Whether the wheel is independent of OS, Python, and architecture.
        type: boolean
        default: false
      pure-conda:
        description: "One of: [true, false, cuda_major]"
        type: string
        default: "false"
    outputs:
      matrix:
        value: ${{ jobs.compute-matrix.outputs.matrix }}
jobs:
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute-matrix.outputs.matrix }}
    steps:
      - name: Prepare Build Matrix
        id: prepare-matrix
        uses: $/.github/actions/prepare-matrix-dispatch
        with:
          action-repo: ${{ github.action_repository }}
          action-ref: ${{ github.action_ref }}
          resolved-matrix: ${{ inputs.resolved-matrix }}
      - name: Compute Build Matrix
        id: compute-matrix
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          MATRIX_NAME: ${{ inputs.matrix_name }}
          MATRIX_TYPE: ${{ inputs.matrix_type }}
          MATRIX: ${{ steps.prepare-matrix.outputs.matrix }}
          RESOLVED_MATRIX: ${{ inputs.resolved-matrix }}
          MATRIX_FILTER: ${{ inputs.matrix_filter }}
          PURE_WHEEL: ${{ inputs.pure_wheel }}
          PURE_CONDA: ${{ inputs.pure-conda }}
        run: bash shared-workflows/.github/actions/prepare-matrix/compute.sh
