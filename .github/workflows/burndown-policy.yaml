on:
  workflow_call:
    outputs:
      skip-product-ci:
        description: Whether this is a same-repository version-update burndown PR to main
        value: ${{ jobs.identify.outputs.skip-product-ci }}

permissions:
  contents: read
  pull-requests: read

jobs:
  identify:
    runs-on: ubuntu-latest
    outputs:
      skip-product-ci: ${{ steps.policy.outputs.skip-product-ci }}
    steps:
      - name: Get PR Info
        id: pr
        if: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'pull-request/') }}
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main
      - name: Identify release burndown candidate
        id: policy
        env:
          PR_INFO: ${{ steps.pr.outputs.pr-info || '{}' }}
        run: |
          if jq -e --arg repository "$GITHUB_REPOSITORY" '
            .base.ref == "main"
            and .head.repo.full_name == $repository
            and ((.head.ref // "") | test("^version-update-[0-9]+\\.[0-9]{2}$"))
            and ([.labels[]?.name] | index("non-breaking") != null and index("improvement") != null)
            and ((.body // "") | test("This is part of the [0-9]+\\.[0-9]{2} release burndown process\\."))
          ' <<< "$PR_INFO" >/dev/null; then
            echo 'skip-product-ci=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip-product-ci=false' >> "$GITHUB_OUTPUT"
          fi
