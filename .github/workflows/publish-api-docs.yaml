name: Publish API docs

on:
  workflow_call:
    inputs:
      container-image:
        description: Container image URI
        type: string
        default: rapidsai/ci-conda:26.10-latest
      container-options:
        description: |
          Command-line arguments passed to 'docker run' when starting the container this workflow runs in.
          This should be provided as a single string to be inlined into 'docker run', not an array.
          For example, '--quiet --ulimit nofile=2048'.
        required: false
        type: string
        default: -e _NOOP
      docs-projects:
        description: Comma-delimited list of project names, e.g. "cudf,libcudf"
        required: true
        type: string
      dry-run:
        default: false
        description: If true, run without making any changes
        required: false
        type: boolean
      source-path:
        default: docs
        description: Local path to download docs to
        required: false
        type: string
      source-s3-bucket:
        default: rapidsai-docs
        description: The S3 bucket to download files from
        required: false
        type: string
      target-s3-key-prefix:
        default: "developer/docs"
        description: Prefix for the S3 key to upload files to
        required: false
        type: string
      version-map:
        description: |
          JSON map of tag to library version, e.g. '{"stable": "26.08", "nightly": "26.10"}'
        required: true
        type: string
    secrets:
      akamai-access-token:
        description: Akamai EdgeGrid access token
        required: true
      akamai-client-token:
        description: Akamai EdgeGrid client token
        required: true
      akamai-client-secret:
        description: Akamai EdgeGrid client secret
        required: true
      akamai-emails-to-notify:
        description: Comma-delimited list of email addresses to notify
        required: false
      akamai-host:
        description: Akamai API hostname
        required: true
      target-aws-access-key-id:
        description: AWS access key ID
        required: true
      target-aws-region:
        description: AWS region
        required: true
      target-aws-secret-access-key:
        description: AWS secret access key
        required: true
      target-s3-bucket:
        description: The S3 bucket to upload files to
        required: true

defaults:
  run:
    shell: bash

jobs:
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        env:
          DOCS_PROJECTS: ${{ inputs.docs-projects }}
        run: |
          matrix=$(echo "${DOCS_PROJECTS}" | jq -Rc 'split(",")')
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  publish-api-docs:
    needs: compute-matrix
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container-image }} # zizmor: ignore[unpinned-images]
      options: ${{ inputs.container-options }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Read VERSION file
        id: version
        working-directory: repo
        run: |
          echo rapids-version-major-minor="$(rapids-version-major-minor)" >> "${GITHUB_OUTPUT}"

      - name: Check for tag
        id: check-tag
        working-directory: repo
        env:
          VERSION: ${{ steps.version.outputs.rapids-version-major-minor }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}"; then
            echo "tag-exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag-exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Compute Akamai request name
        id: akamai
        env:
          PROJECT: ${{ matrix.project }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          name="$(echo "${REPO}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')-${RUN_ID}-${PROJECT}"
          echo "request-name=${name}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Download docs
        env:
          S3_BUCKET: ${{ inputs.source-s3-bucket }}
          S3_KEY: ${{ matrix.project }}
          S3_KEY_SUFFIX: ${{ steps.version.outputs.rapids-version-major-minor }}
          SOURCE_PATH: ${{ inputs.source-path }}
        run: |
          aws s3 sync "s3://${S3_BUCKET}/${S3_KEY}/html/${S3_KEY_SUFFIX}" "${SOURCE_PATH}"

      # if on main
      # publish <project>/latest
      - name: Publish latest version to docs.nvidia.com/<project>/latest
        if: github.ref == 'refs/heads/main'
        uses: rapidsai/shared-actions/publish-docs@main
        with:
          akamai-access-token: ${{ secrets.akamai-access-token }}
          akamai-client-secret: ${{ secrets.akamai-client-secret }}
          akamai-client-token: ${{ secrets.akamai-client-token }}
          akamai-emails-to-notify: ${{ secrets.akamai-emails-to-notify }}
          akamai-host: ${{ secrets.akamai-host }}
          akamai-request-name: ${{ steps.akamai.outputs.request-name }}-latest
          dry-run: ${{ inputs.dry-run }}
          source-path: ${{ inputs.source-path }}
          target-aws-access-key-id: ${{ secrets.target-aws-access-key-id }}
          target-aws-region: ${{ secrets.target-aws-region }}
          target-aws-secret-access-key: ${{ secrets.target-aws-secret-access-key }}
          target-s3-bucket: ${{ secrets.target-s3-bucket }}
          target-s3-key-prefix: ${{ inputs.target-s3-key-prefix }}
          target-s3-key-suffix: latest
          target-s3-key: ${{ matrix.project }}

      # if on release/<version> and tagged
      # publish <project>/<version>
      - name: Publish calendar version to docs.nvidia.com/<project>/<version>
        if: startsWith(github.ref_name, 'release/') && steps.check-tag.outputs.tag-exists == 'true'
        uses: rapidsai/shared-actions/publish-docs@main
        with:
          akamai-access-token: ${{ secrets.akamai-access-token }}
          akamai-client-secret: ${{ secrets.akamai-client-secret }}
          akamai-client-token: ${{ secrets.akamai-client-token }}
          akamai-emails-to-notify: ${{ secrets.akamai-emails-to-notify }}
          akamai-host: ${{ secrets.akamai-host }}
          akamai-request-name: ${{ steps.akamai.outputs.request-name }}-${{ steps.version.outputs.rapids-version-major-minor }}
          dry-run: ${{ inputs.dry-run }}
          source-path: ${{ inputs.source-path }}
          target-aws-access-key-id: ${{ secrets.target-aws-access-key-id }}
          target-aws-region: ${{ secrets.target-aws-region }}
          target-aws-secret-access-key: ${{ secrets.target-aws-secret-access-key }}
          target-s3-bucket: ${{ secrets.target-s3-bucket }}
          target-s3-key-prefix: ${{ inputs.target-s3-key-prefix }}
          target-s3-key-suffix: ${{ steps.version.outputs.rapids-version-major-minor }}
          target-s3-key: ${{ matrix.project }}

  publish-versions-json:
    needs: compute-matrix
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container-image }} # zizmor: ignore[unpinned-images]
      options: ${{ inputs.container-options }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main  # we need main to determine the YY.MM version corresponding to "latest"
          path: repo
          persist-credentials: false
          fetch-depth: 0

      - name: Read VERSION file
        id: version
        working-directory: repo
        run: |
          echo rapids-version-major-minor="$(rapids-version-major-minor)" >> "${GITHUB_OUTPUT}"

      - name: List git tags
        id: tags
        working-directory: repo
        run: |
          # Keep only tags matching "vYY.MM.PP" (e.g. "v26.10.00"), strip the leading "v" and
          # the trailing ".PP" patch component, and collect the results into a JSON array.
          tags="$(
            git tag -l \
              | { grep -E '^v[0-9]{2}\.[0-9]{2}\.[0-9]{2}$' || true; } \
              | sed -E 's/^v([0-9]{2}\.[0-9]{2})\.[0-9]{2}$/\1/' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "${tags}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.target-aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.target-aws-secret-access-key }}
          aws-region: ${{ secrets.target-aws-region }}

      - name: List S3 subdirectories
        id: s3-versions
        env:
          BUCKET: ${{ secrets.target-s3-bucket }}
          PROJECT: ${{ matrix.project }}
          S3_KEY_PREFIX: ${{ inputs.target-s3-key-prefix }}
        run: |
          # List the subdirectory names (versions) under the project's S3 prefix, strip the
          # key prefix and trailing slash from each, keep only those matching "YY.MM"
          # (e.g. "26.10"), and collect the results into a JSON array.
          prefix="${S3_KEY_PREFIX}/${PROJECT}/"
          versions="$(
            aws s3api list-objects-v2 --bucket "${BUCKET}" --prefix "${prefix}" --delimiter / --query 'CommonPrefixes[].Prefix' --output text \
              | tr '\t' '\n' \
              | sed "s#^${prefix}##;s#/\$##" \
              | { grep -E '^[0-9]{2}\.[0-9]{2}$' || true; } \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"
          echo "versions=${versions}" >> "${GITHUB_OUTPUT}"
          echo "${versions}"

      - name: Generate versions.json
        env:
          PROJECT: ${{ matrix.project }}
          S3_VERSIONS: ${{ steps.s3-versions.outputs.versions }}
          TAGS: ${{ steps.tags.outputs.tags }}
          LATEST_VERSION: ${{ steps.version.outputs.rapids-version-major-minor }}
        run: |
          # Keep only S3 versions that also have a matching git tag (i.e. released versions),
          # build a versions.json entry for each with its docs URL, and sort them newest-first.
          # Mark the newest entry as "preferred", then prepend a "latest" entry pointing at the
          # /latest/ alias, with its "version" set according to the VERSION file currently on
          # "main", otherwise the switcher will just show "Choose version".
          jq -n -S \
            --arg project "${PROJECT}" \
            --argjson s3_versions "${S3_VERSIONS}" \
            --argjson tags "${TAGS}" \
            --arg latest_version "${LATEST_VERSION}" \
            '
              ($tags | unique) as $t
              | [$s3_versions | unique | .[] | select(. as $v | $t | index($v))]
              | map({
                  name: .,
                  url: "https://docs.nvidia.com/\($project)/\(.)/",
                  version: .
                })
              | sort_by(.version)
              | reverse
              | if length > 0 then .[0] += {preferred: "true"} else . end
              | [{name: "latest", url: "https://docs.nvidia.com/\($project)/latest/", version: $latest_version}] + .
            ' > versions.json
          cat versions.json

      - name: Compute Akamai request name
        id: akamai
        env:
          PROJECT: ${{ matrix.project }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          name="$(echo "${REPO}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')-${RUN_ID}-${PROJECT}-versions-json"
          echo "request-name=${name}" >> "${GITHUB_OUTPUT}"

      - name: Publish versions.json
        uses: rapidsai/shared-actions/publish-one-doc@main
        with:
          akamai-access-token: ${{ secrets.akamai-access-token }}
          akamai-client-secret: ${{ secrets.akamai-client-secret }}
          akamai-client-token: ${{ secrets.akamai-client-token }}
          akamai-emails-to-notify: ${{ secrets.akamai-emails-to-notify }}
          akamai-host: ${{ secrets.akamai-host }}
          akamai-request-name: ${{ steps.akamai.outputs.request-name }}-versions
          dry-run: ${{ inputs.dry-run }}
          file-path: ./versions.json
          target-aws-access-key-id: ${{ secrets.target-aws-access-key-id }}
          target-aws-region: ${{ secrets.target-aws-region }}
          target-aws-secret-access-key: ${{ secrets.target-aws-secret-access-key }}
          target-s3-bucket: ${{ secrets.target-s3-bucket }}
          target-s3-key: ${{ matrix.project }}
