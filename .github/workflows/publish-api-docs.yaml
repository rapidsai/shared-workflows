name: Publish API docs

on:
  workflow_call:
    inputs:
      build_type:
        description: Build type; release candidates must not publish documentation.
        required: false
        type: string
        default: ''
      container-image:
        description: Container image URI
        type: string
        default: rapidsai/ci-conda:26.12-latest
      container-options:
        description: |
          Command-line arguments passed to 'docker run' when starting the container this workflow runs in.
          This should be provided as a single string to be inlined into 'docker run', not an array.
          For example, '--quiet --ulimit nofile=2048'.
        required: false
        type: string
        default: -e _NOOP
      docs-projects:
        description: Comma-delimited list of project names, e.g. "cudf,libcudf"
        required: true
        type: string
      branch:
        description: Git branch the workflow run targets.
        required: false
        type: string
      dry-run:
        default: false
        description: If true, run without making any changes
        required: false
        type: boolean
      source-path:
        default: docs
        description: Local path to download docs to
        required: false
        type: string
      source-s3-bucket:
        default: rapidsai-docs
        description: The S3 bucket to download files from
        required: false
        type: string
      target-s3-key-prefix:
        default: "developer/docs"
        description: Prefix for the S3 key to upload files to
        required: false
        type: string
      version-map:
        default: ''
        description: |
          JSON map of tag to library version
        required: false
        type: string
defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: none

jobs:
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        env:
          DOCS_PROJECTS: ${{ inputs.docs-projects }}
        run: |
          matrix=$(echo "${DOCS_PROJECTS}" | jq -Rc 'split(",")')
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  publish-api-docs:
    if: ${{ inputs.build_type != 'release-candidate' && github.event.inputs.build_type != 'release-candidate' && !(github.ref_type == 'branch' && startsWith(github.ref_name, 'release-test-')) && !startsWith(github.head_ref, 'release-test-') && !startsWith(inputs.branch, 'release-test-') && !startsWith(inputs.branch, 'refs/heads/release-test-') && github.ref != 'agent/release-catalog-canary' && github.ref != 'refs/heads/agent/release-catalog-canary' && github.head_ref != 'agent/release-catalog-canary' && github.head_ref != 'refs/heads/agent/release-catalog-canary' && inputs.branch != 'agent/release-catalog-canary' && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    environment: public-publication
    permissions:
      contents: read
      id-token: write
    needs: compute-matrix
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container-image }} # zizmor: ignore[unpinned-images]
      options: ${{ inputs.container-options }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Read VERSION file
        id: version
        working-directory: repo
        run: |
          echo rapids-version-major-minor="$(rapids-version-major-minor)" >> "${GITHUB_OUTPUT}"

      - name: Compute Akamai request name
        id: akamai
        env:
          PROJECT: ${{ matrix.project }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          name="$(echo "${REPO}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')-${RUN_ID}-${PROJECT}"
          echo "request-name=${name}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.PUBLICATION_AWS_ROLE_ARN }}

      - name: Download docs
        env:
          S3_BUCKET: ${{ inputs.source-s3-bucket }}
          S3_KEY: ${{ matrix.project }}
          S3_KEY_SUFFIX: ${{ steps.version.outputs.rapids-version-major-minor }}
          SOURCE_PATH: ${{ inputs.source-path }}
        run: |
          aws s3 sync "s3://${S3_BUCKET}/${S3_KEY}/html/${S3_KEY_SUFFIX}" "${SOURCE_PATH}"

      # if on main
      # publish <project>/latest
      - name: Publish latest version to docs.nvidia.com/<project>/latest
        if: github.ref == 'refs/heads/main'
        uses: rapidsai/shared-actions/publish-docs@main
        with:
          akamai-access-token: ${{ secrets.NVIDIA_DOCS_AKAMAI_ACCESS_TOKEN }}
          akamai-client-secret: ${{ secrets.NVIDIA_DOCS_AKAMAI_CLIENT_SECRET }}
          akamai-client-token: ${{ secrets.NVIDIA_DOCS_AKAMAI_CLIENT_TOKEN }}
          akamai-emails-to-notify: ${{ secrets.NVIDIA_DOCS_AKAMAI_EMAILS_TO_NOTIFY }}
          akamai-host: ${{ secrets.NVIDIA_DOCS_AKAMAI_HOST }}
          akamai-request-name: ${{ steps.akamai.outputs.request-name }}-latest
          dry-run: ${{ inputs.dry-run }}
          source-path: ${{ inputs.source-path }}
          target-aws-access-key-id: ${{ secrets.NVIDIA_DOCS_AWS_ACCESS_KEY_ID }}
          target-aws-region: ${{ secrets.NVIDIA_DOCS_AWS_REGION }}
          target-aws-secret-access-key: ${{ secrets.NVIDIA_DOCS_AWS_SECRET_ACCESS_KEY }}
          target-s3-bucket: ${{ secrets.NVIDIA_DOCS_S3_BUCKET }}
          target-s3-key-prefix: ${{ inputs.target-s3-key-prefix }}
          target-s3-key-suffix: latest
          target-s3-key: ${{ matrix.project }}

      # if on release/<version>
      # publish <project>/<version>
      - name: Publish calendar version to docs.nvidia.com/<project>/<version>
        if: startsWith(github.ref_name, 'release/')
        uses: rapidsai/shared-actions/publish-docs@main
        with:
          akamai-access-token: ${{ secrets.NVIDIA_DOCS_AKAMAI_ACCESS_TOKEN }}
          akamai-client-secret: ${{ secrets.NVIDIA_DOCS_AKAMAI_CLIENT_SECRET }}
          akamai-client-token: ${{ secrets.NVIDIA_DOCS_AKAMAI_CLIENT_TOKEN }}
          akamai-emails-to-notify: ${{ secrets.NVIDIA_DOCS_AKAMAI_EMAILS_TO_NOTIFY }}
          akamai-host: ${{ secrets.NVIDIA_DOCS_AKAMAI_HOST }}
          akamai-request-name: ${{ steps.akamai.outputs.request-name }}-${{ steps.version.outputs.rapids-version-major-minor }}
          dry-run: ${{ inputs.dry-run }}
          source-path: ${{ inputs.source-path }}
          target-aws-access-key-id: ${{ secrets.NVIDIA_DOCS_AWS_ACCESS_KEY_ID }}
          target-aws-region: ${{ secrets.NVIDIA_DOCS_AWS_REGION }}
          target-aws-secret-access-key: ${{ secrets.NVIDIA_DOCS_AWS_SECRET_ACCESS_KEY }}
          target-s3-bucket: ${{ secrets.NVIDIA_DOCS_S3_BUCKET }}
          target-s3-key-prefix: ${{ inputs.target-s3-key-prefix }}
          target-s3-key-suffix: ${{ steps.version.outputs.rapids-version-major-minor }}
          target-s3-key: ${{ matrix.project }}

  publish-versions-json:
    if: ${{ inputs.build_type != 'release-candidate' && github.event.inputs.build_type != 'release-candidate' && !(github.ref_type == 'branch' && startsWith(github.ref_name, 'release-test-')) && !startsWith(github.head_ref, 'release-test-') && !startsWith(inputs.branch, 'release-test-') && !startsWith(inputs.branch, 'refs/heads/release-test-') && github.ref != 'agent/release-catalog-canary' && github.ref != 'refs/heads/agent/release-catalog-canary' && github.head_ref != 'agent/release-catalog-canary' && github.head_ref != 'refs/heads/agent/release-catalog-canary' && inputs.branch != 'agent/release-catalog-canary' && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    environment: public-publication
    needs: compute-matrix
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container-image }} # zizmor: ignore[unpinned-images]
      options: ${{ inputs.container-options }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main  # we need main to determine the YY.MM version corresponding to "latest"
          path: repo
          persist-credentials: false
          fetch-depth: 0

      - name: Read VERSION file
        id: version
        working-directory: repo
        run: |
          echo rapids-version-major-minor="$(rapids-version-major-minor)" >> "${GITHUB_OUTPUT}"

      - name: List git tags
        id: tags
        working-directory: repo
        run: |
          # Keep only tags matching "vYY.MM.PP", strip the leading "v" and
          # the trailing ".PP" patch component, and collect the results into a JSON array.
          tags="$(
            git tag -l \
              | { grep -E '^v[0-9]{2}\.[0-9]{2}\.[0-9]{2}$' || true; } \
              | sed -E 's/^v([0-9]{2}\.[0-9]{2})\.[0-9]{2}$/\1/' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "${tags}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.NVIDIA_DOCS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.NVIDIA_DOCS_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.NVIDIA_DOCS_AWS_REGION }}

      - name: List S3 subdirectories
        id: s3-versions
        env:
          BUCKET: ${{ secrets.NVIDIA_DOCS_S3_BUCKET }}
          PROJECT: ${{ matrix.project }}
          S3_KEY_PREFIX: ${{ inputs.target-s3-key-prefix }}
        run: |
          # List the subdirectory names (versions) under the project's S3 prefix, strip the
          # key prefix and trailing slash from each, keep only those matching "YY.MM",
          # and collect the results into a JSON array.
          prefix="${S3_KEY_PREFIX}/${PROJECT}/"
          versions="$(
            aws s3api list-objects-v2 --bucket "${BUCKET}" --prefix "${prefix}" --delimiter / --query 'CommonPrefixes[].Prefix' --output text \
              | tr '\t' '\n' \
              | sed "s#^${prefix}##;s#/\$##" \
              | { grep -E '^[0-9]{2}\.[0-9]{2}$' || true; } \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"
          echo "versions=${versions}" >> "${GITHUB_OUTPUT}"
          echo "${versions}"

      - name: List archive S3 subdirectories
        id: s3-archive-versions
        env:
          BUCKET: ${{ secrets.NVIDIA_DOCS_ARCHIVE_S3_BUCKET }}
          PROJECT: ${{ matrix.project }}
        run: |
          # If BUCKET is empty (the secret has no value), skip the S3 lookup and report no
          # archived versions. Otherwise list the subdirectory names (versions) under the
          # project's S3 prefix, strip the key prefix and trailing slash from each, keep only
          # those matching "YY.MM", and collect the results into a JSON array.
          if [ -z "${BUCKET}" ]; then
            archived_versions="[]"
          else
            prefix="${PROJECT}/"
            archived_versions="$(
              aws s3api list-objects-v2 --bucket "${BUCKET}" --prefix "${prefix}" --delimiter / --query 'CommonPrefixes[].Prefix' --output text \
                | tr '\t' '\n' \
                | sed "s#^${prefix}##;s#/\$##" \
                | { grep -E '^[0-9]{2}\.[0-9]{2}$' || true; } \
                | jq -R -s -c 'split("\n") | map(select(length > 0))'
            )"
          fi
          echo "archived-versions=${archived_versions}" >> "${GITHUB_OUTPUT}"
          echo "${archived_versions}"

      - name: Generate versions.json
        env:
          PROJECT: ${{ matrix.project }}
          S3_VERSIONS: ${{ steps.s3-versions.outputs.versions }}
          ARCHIVED_VERSIONS: ${{ steps.s3-archive-versions.outputs.archived-versions }}
          TAGS: ${{ steps.tags.outputs.tags }}
          LATEST_VERSION: ${{ steps.version.outputs.rapids-version-major-minor }}
        run: |
          # Keep only S3 versions that also have a matching git tag (i.e. released versions),
          # build a versions.json entry for each with its docs URL, and add an entry for each
          # archived version pointing at its archive.docs.nvidia.com URL. Sort the combined list
          # newest-first, and mark the newest entry as "preferred", then prepend a "latest" entry
          # pointing at the /latest/ alias, with its "version" set according to the VERSION file
          # currently on "main", otherwise the switcher will just show "Choose version".
          jq -n -S \
            --arg project "${PROJECT}" \
            --argjson s3_versions "${S3_VERSIONS}" \
            --argjson archived_versions "${ARCHIVED_VERSIONS}" \
            --argjson tags "${TAGS}" \
            --arg latest_version "${LATEST_VERSION}" \
            '
              ($tags | unique) as $t
              | [$s3_versions | unique | .[] | select(. as $v | $t | index($v))]
              | map({
                  name: .,
                  url: "https://docs.nvidia.com/\($project)/\(.)/",
                  version: .
                })
              | . + ($archived_versions | unique | map({
                  name: .,
                  url: "https://archive.docs.nvidia.com/\($project)/\(.)/",
                  version: .
                }))
              | sort_by(.version)
              | reverse
              | if length > 0 then .[0] += {preferred: "true"} else . end
              | [{name: "latest", url: "https://docs.nvidia.com/\($project)/latest/", version: $latest_version}] + .
            ' > versions.json
          cat versions.json

      - name: Compute Akamai request name
        id: akamai
        env:
          PROJECT: ${{ matrix.project }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          name="$(echo "${REPO}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')-${RUN_ID}-${PROJECT}-versions-json"
          echo "request-name=${name}" >> "${GITHUB_OUTPUT}"

      - name: Publish versions.json
        uses: rapidsai/shared-actions/publish-one-doc@main
        with:
          akamai-access-token: ${{ secrets.NVIDIA_DOCS_AKAMAI_ACCESS_TOKEN }}
          akamai-client-secret: ${{ secrets.NVIDIA_DOCS_AKAMAI_CLIENT_SECRET }}
          akamai-client-token: ${{ secrets.NVIDIA_DOCS_AKAMAI_CLIENT_TOKEN }}
          akamai-emails-to-notify: ${{ secrets.NVIDIA_DOCS_AKAMAI_EMAILS_TO_NOTIFY }}
          akamai-host: ${{ secrets.NVIDIA_DOCS_AKAMAI_HOST }}
          akamai-request-name: ${{ steps.akamai.outputs.request-name }}-versions
          dry-run: ${{ inputs.dry-run }}
          file-path: ./versions.json
          target-aws-access-key-id: ${{ secrets.NVIDIA_DOCS_AWS_ACCESS_KEY_ID }}
          target-aws-region: ${{ secrets.NVIDIA_DOCS_AWS_REGION }}
          target-aws-secret-access-key: ${{ secrets.NVIDIA_DOCS_AWS_SECRET_ACCESS_KEY }}
          target-s3-bucket: ${{ secrets.NVIDIA_DOCS_S3_BUCKET }}
          target-s3-key: ${{ matrix.project }}
