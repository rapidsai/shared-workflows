# The release-build entrypoint for rapidsai/ci-imgs' CI images. Hand-written: ci-imgs has no candidate workflow
# here for ci/release_build_entrypoints.py to derive it from. Ported from the release 26.12 job that
# release-tracking carried inline (releases/26.12/handwritten/ci-imgs.yml), so that a release workflow calls it
# like the other release-build entrypoints and the run page groups its matrix rows under one job.
#
# It runs only as a release-build candidate in release-tracking: credentials use the release-build role, the
# producer is named explicitly to shared-actions, and the train comes from the caller's load-train job.
# Each row pushes its image to private GHCR (ghcr.io/rapidsai/release-candidates/<ci-conda|ci-wheel>) and uploads a
# small image record naming that manifest by digest instead of an OCI archive; collection reads the manifest back
# from GHCR. Release builds will run in these images by digest. The BuildKit layer cache is in the same private namespace and only
# release runs write it; the public main cache stays a second source until it is warm. See rapids-work
# plans/ghcr-candidate-images.md.
on:
  workflow_call:
    inputs:
      candidate-matrix:
        description: >-
          The image matrix ({"include": [...]}), as RAPIDS_VERSION_MAJOR_MINOR=<version>
          ci/compute-candidate-matrix.sh printed it, written into the per-release workflow by its generator.
          Every row re-runs that script at sha and fails if the matrix changed.
        required: true
        type: string
      sha:
        description: "Full ci-imgs commit SHA the train builds."
        required: true
        type: string
      candidate-train-sha256:
        description: "Canonical SHA-256 of the release train."
        required: true
        type: string
      rapids-version:
        description: "RAPIDS version (YY.MM) the images are built for; must match the train and ci-imgs' VERSION."
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.IMAGE_REPO }}, ${{ matrix.CUDA_VER }}, ${{ matrix.LINUX_VER }}, py${{ matrix.PYTHON_VER }}, ${{ matrix.ARCH }}
    strategy:
      fail-fast: false
      max-parallel: 50
      matrix: ${{ fromJSON(inputs.candidate-matrix) }}
    runs-on: linux-${{ matrix.ARCH }}-cpu4
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      RAPIDS_SHA: ${{ inputs.sha }}
      BUILD_TYPE: release-candidate
      IMAGE_REPO: ${{ matrix.IMAGE_REPO }}
      DOCKER_TARGET: ${{ matrix.DOCKER_TARGET }}
      ARCH: ${{ matrix.ARCH }}
      CUDA_VER: ${{ matrix.CUDA_VER }}
      LINUX_VER: ${{ matrix.LINUX_VER }}
      PYTHON_VER: ${{ matrix.PYTHON_VER }}
      RAPIDS_VERSION_MAJOR_MINOR: ${{ inputs.rapids-version }}
    steps:
      - name: Check the caller's inputs
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          TRAIN_SHA256: ${{ inputs.candidate-train-sha256 }}
          CALLER: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'sha must be a full commit SHA' >&2; exit 1; }
          [[ "${TRAIN_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo 'candidate-train-sha256 must be a SHA-256' >&2; exit 1; }
          [[ "${RAPIDS_VERSION_MAJOR_MINOR}" =~ ^[0-9]{2}\.[0-9]{2}$ ]] || { echo 'rapids-version must be YY.MM' >&2; exit 1; }
          [[ "${CALLER}" == rapidsai/release-tracking ]] || { echo 'only release-tracking runs release builds' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rapidsai/ci-imgs
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify runner BuildKit configuration is readable
        run: ci/check-candidate-buildkit-config.sh
      - name: Isolate Docker registry configuration
        run: |
          candidate_docker_config=$(mktemp -d "${RUNNER_TEMP}/candidate-docker-config.XXXXXX")
          echo "DOCKER_CONFIG=${candidate_docker_config}" >> "${GITHUB_ENV}"
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-release-build
      - name: Check this row against the frozen train and ci-imgs' own matrix
        env:
          TRAIN_SHA256: ${{ inputs.candidate-train-sha256 }}
          SOURCE_SHA: ${{ inputs.sha }}
          ROW: ${{ toJSON(matrix) }}
          ROWS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" ]]; then
            echo 'ci-imgs checkout does not match the train source commit' >&2
            exit 1
          fi
          train="${RUNNER_TEMP}/candidate-train.json"
          aws s3 cp "s3://rapids-release-candidates/train-state/${TRAIN_SHA256}/release-train.json" "${train}"
          actual_digest=$(jq -cSj 'del(.train_sha256)' "${train}" | sha256sum | awk '{print $1}')
          if [[ "${actual_digest}" != "${TRAIN_SHA256}" ]]; then
            echo 'Stored train digest does not match candidate-train-sha256' >&2
            exit 1
          fi
          if ! jq -e --arg sha "${SOURCE_SHA}" '
            .source_revisions["ci-imgs"] == $sha and
            any(.release_units[]; .id == "container:ci-images" and .source_revision == $sha)
          ' "${train}" > /dev/null; then
            echo 'The train does not build container:ci-images from this ci-imgs commit' >&2
            exit 1
          fi
          version=$(jq -r '.version_contract.package_versions.container' "${train}")
          if [[ "${version}" != "${RAPIDS_VERSION_MAJOR_MINOR}" ]]; then
            echo "The train's container version ${version} is not the caller's ${RAPIDS_VERSION_MAJOR_MINOR}" >&2
            exit 1
          fi
          if [[ "$(cut -d. -f1,2 VERSION)" != "${version}" ]]; then
            echo 'CI image source VERSION does not match the frozen train container version' >&2
            exit 1
          fi
          # The rows are fixed in the release file; ci-imgs at the train's commit must still produce exactly them.
          matrix=$(ci/compute-candidate-matrix.sh)
          if ! jq -e --argjson row "${ROW}" --argjson rows "${ROWS}" \
            '(.include | length) == $rows and any(.include[]; . == $row)' <<<"${matrix}" > /dev/null; then
            echo "::error title=ci-imgs matrix changed::ci-imgs ${SOURCE_SHA} no longer produces this row or ${ROWS} rows. Regenerate the release's ci-imgs matrix and its release workflow." >&2
            exit 1
          fi
      - name: Prepare frozen candidate build inputs
        uses: rapidsai/shared-actions/release-candidate-dependencies@0e2f52c10e4e6b9c53358b12e4081fa6ab1a02de
        env:
          RELEASE_CANDIDATE_SHARED_ACTIONS_REPOSITORY: rapidsai/shared-actions
          RELEASE_CANDIDATE_SHARED_ACTIONS_REVISION: '0e2f52c10e4e6b9c53358b12e4081fa6ab1a02de'
        with:
          producer-repository: rapidsai/ci-imgs
          producer-sha: ${{ inputs.sha }}
          candidate-train-sha256: ${{ inputs.candidate-train-sha256 }}
          artifact-family: container
          candidate-unit-id: container:ci-images
          implementation-mode: direct
          # These build images consume no train package dependencies or private channel.
          prepare-conda-channel: 'false'
          arch: ${{ matrix.ARCH }}
          cuda-version: ${{ matrix.CUDA_VER }}
          python-version: ${{ matrix.PYTHON_VER }}
      - name: Stage train-frozen gha-tools for image bootstrap
        run: ci/stage-candidate-gha-tools.sh
      - name: Set up Docker Context for Buildx
        run: docker context create builders
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          endpoint: builders
          buildkitd-config: /etc/buildkit/buildkitd.toml
          buildkitd-flags: --debug
      - name: Generate frozen build arguments
        id: args
        env:
          CANDIDATE_IMAGE_MIRROR: 'true'
          CANDIDATE_GHA_TOOLS_SOURCE: 'true'
        run: ci/compute-build-args.sh
      - name: Preserve the CI wheel base environment
        if: ${{ matrix.DOCKERFILE == 'ci-wheel.Dockerfile' }}
        env:
          DOCKERFILE: ${{ matrix.DOCKERFILE }}
          BASE_IMAGE: ${{ steps.args.outputs.BASE_IMAGE }}
        run: ci/sync-base-env.sh "${BASE_IMAGE}" "${DOCKERFILE}"
      - name: Name the GHCR candidate image and layer cache
        id: ghcr
        env:
          IMAGE_REPO: ${{ matrix.IMAGE_REPO }}
          IMAGE_NAME: ${{ matrix.IMAGE_NAME }}
          ARCH: ${{ matrix.ARCH }}
          TRAIN_SHA256: ${{ inputs.candidate-train-sha256 }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_REPO}" == ci-conda || "${IMAGE_REPO}" == ci-wheel ]] || { echo "unexpected image repository ${IMAGE_REPO}" >&2; exit 1; }
          [[ "${ARCH}" == amd64 || "${ARCH}" == arm64 ]] || { echo "unexpected architecture ${ARCH}" >&2; exit 1; }
          [[ "${TRAIN_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo 'candidate-train-sha256 must be a SHA-256' >&2; exit 1; }
          variant="${IMAGE_NAME#*:}"
          if [[ "${IMAGE_NAME}" != *:* || ! "${variant}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "unexpected image name ${IMAGE_NAME}" >&2
            exit 1
          fi
          tag="${TRAIN_SHA256}-${variant}-${ARCH}"
          cache_tag="${IMAGE_REPO}-${variant}-${ARCH}"
          if (( ${#tag} > 128 || ${#cache_tag} > 128 )); then
            echo "image tag for ${IMAGE_NAME} is longer than 128 characters" >&2
            exit 1
          fi
          {
            echo "image=ghcr.io/rapidsai/release-candidates/${IMAGE_REPO}:${tag}"
            echo "cache=ghcr.io/rapidsai/release-candidates/buildcache:${cache_tag}"
          } >> "${GITHUB_OUTPUT}"
      - name: Log in to GHCR for candidate images
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the real CI image into private GHCR
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          # One summary block and build-record artifact per image row floods the release run's page.
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: context
          file: ${{ matrix.DOCKERFILE }}
          target: ${{ matrix.DOCKER_TARGET }}
          platforms: linux/${{ matrix.ARCH }}
          pull: true
          push: false
          cache-from: |
            type=registry,ref=${{ steps.ghcr.outputs.cache }}
            type=registry,ref=${{ matrix.MAIN_CACHE_IMAGE_NAME }}-buildcache-${{ matrix.ARCH }}
          cache-to: type=registry,ref=${{ steps.ghcr.outputs.cache }},mode=max,oci-mediatypes=true,image-manifest=true
          build-args: ${{ steps.args.outputs.ARGS }}
          # No `tags`: buildx pushes a registry export to every tag (release run 45474940796 tried docker.io). The
          # only export is the private GHCR image; S3 keeps a record of it, not an archive.
          outputs: |
            type=registry,name=${{ steps.ghcr.outputs.image }},oci-mediatypes=true
          provenance: false
          sbom: false
          secrets: |
            GH_TOKEN=${{ github.token }}
      - name: Write the GHCR image record
        id: record
        env:
          IMAGE: ${{ steps.ghcr.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPO: ${{ matrix.IMAGE_REPO }}
          IMAGE_NAME: ${{ matrix.IMAGE_NAME }}
          ARCH: ${{ matrix.ARCH }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "the build reported no image digest" >&2; exit 1; }
          [[ "${IMAGE_REPO}" == ci-conda || "${IMAGE_REPO}" == ci-wheel ]] || { echo "unexpected image repository ${IMAGE_REPO}" >&2; exit 1; }
          [[ "${ARCH}" == amd64 || "${ARCH}" == arm64 ]] || { echo "unexpected architecture ${ARCH}" >&2; exit 1; }
          repository="rapidsai/release-candidates/${IMAGE_REPO}"
          [[ "${IMAGE}" == "ghcr.io/${repository}:"* ]] || { echo "unexpected candidate image ${IMAGE}" >&2; exit 1; }
          variant="${IMAGE_NAME#*:}"
          if [[ "${IMAGE_NAME}" != "rapidsai/${IMAGE_REPO}:${variant}" || "${variant}" != "${RAPIDS_VERSION_MAJOR_MINOR}-"* \
            || ! "${variant}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "image ${IMAGE_NAME} does not match the frozen container version ${RAPIDS_VERSION_MAJOR_MINOR}" >&2
            exit 1
          fi
          # Read the pushed manifest back by digest. Its exact bytes must hash to that digest; inspect may add one
          # trailing newline, which is not part of the manifest.
          raw="${RUNNER_TEMP}/ghcr-manifest.json"
          docker buildx imagetools inspect "ghcr.io/${repository}@${DIGEST}" --raw > "${raw}.out"
          cp "${raw}.out" "${raw}"
          if [[ "sha256:$(sha256sum "${raw}" | awk '{print $1}')" != "${DIGEST}" ]]; then
            head -c -1 "${raw}.out" > "${raw}"
            if [[ "$(tail -c 1 "${raw}.out" | od -An -c | tr -d ' ')" != '\n' \
              || "sha256:$(sha256sum "${raw}" | awk '{print $1}')" != "${DIGEST}" ]]; then
              echo "GHCR returned a manifest that is not ${DIGEST}" >&2
              exit 1
            fi
          fi
          if ! jq -e '.mediaType == "application/vnd.oci.image.manifest.v1+json"
              and (.config.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))' "${raw}" > /dev/null; then
            echo "GHCR image ${DIGEST} is not a single OCI image manifest" >&2
            exit 1
          fi
          directory=.release-candidate-artifacts/container
          mkdir -p "${directory}"
          jq -n --arg repository "${repository}" --arg digest "${DIGEST}" \
            --arg config "$(jq -r '.config.digest' "${raw}")" --arg platform "linux/${ARCH}" \
            --argjson size "$(wc -c < "${raw}")" \
            '{schema_version: 1, registry: "ghcr.io", repository: $repository, digest: $digest,
              media_type: "application/vnd.oci.image.manifest.v1+json", config_digest: $config,
              platform: $platform, size: $size}' > "${directory}/image-${IMAGE_REPO}-${variant}-${ARCH}.oci-image.json"
          # The same package identity ci-imgs wrote for the archive, so the catalog entry keeps its identity.
          jq -n --arg name "docker.io/rapidsai/${IMAGE_REPO}" --arg version "${RAPIDS_VERSION_MAJOR_MINOR}" \
            --arg build "${variant}-${ARCH}" --arg platform "linux/${ARCH}" \
            '{ecosystem: "container", name: $name, version: $version, build: $build, platform: $platform}' \
            > "${directory}/package-identity.json"
          echo "Candidate image ghcr.io/${repository}@${DIGEST}"
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-release-build
      - name: Publish run-bound private image catalog
        uses: rapidsai/shared-actions/release-catalog-dispatch@0e2f52c10e4e6b9c53358b12e4081fa6ab1a02de
        with:
          producer-repository: rapidsai/ci-imgs
          config: >-
            {"release_catalog_key":"container:ci-images",
            "artifact_directory":".release-candidate-artifacts/container",
            "artifacts":[{"path":"*.oci-image.json","package_identity_file":"package-identity.json"}]}
          source-artifact-name: ci-images-${{ strategy.job-index }}-${{ matrix.ARCH }}
          candidate-train-sha256: ${{ inputs.candidate-train-sha256 }}
          candidate-matrix-arch: ${{ matrix.ARCH }}
          candidate-matrix-cuda-version: ${{ matrix.CUDA_VER }}
          candidate-matrix-python-version: ${{ matrix.PYTHON_VER }}
          upload-to-s3: 'true'
