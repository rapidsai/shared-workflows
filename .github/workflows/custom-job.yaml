on:
  workflow_call:
    inputs:
      build_type:
        description: "One of: [branch, nightly, pull-request, release-candidate]"
        required: true
        type: string
      branch:
        description: |
          Git branch the workflow run targets.
          This is required even when 'sha' is provided because it is also used for organizing artifacts.
        type: string
      date:
        description: "Date (YYYY-MM-DD) this run is for. Used to organize artifacts produced by nightly builds"
        type: string
      sha:
        description: "Full git commit SHA to check out"
        type: string
      build-datetime:
        description: |
          date-time to be used in build strings.
          Unlike input 'date' (set in the call to the calling workflow), this is computed at runtime
          by the calling workflow.
        default: null
        required: false
        type: string
      repo:
        description: "Git repo to check out, in '{org}/{repo}' form, e.g. 'rapidsai/cudf'"
        type: string
      arch:
        description: "One of [amd64, arm64]. CPU architecture to run on."
        type: string
        default: "amd64"
      node_type:
        description: |
          Suffix, without leading '-', indicating the type of machine to run jobs on (e.g., 'cpu4' or 'gpu-l4-latest-1').
          Runner labels are of the form '{operating_system}-{arch}-{node_type}'.
          See https://github.com/nv-gha-runners/enterprise-runner-configuration/blob/main/docs/runner-groups.md for a list
          of valid values.
        type: string
        default: "cpu8"
      container_image:
        description: "Container image URI"
        type: string
        default: "rapidsai/ci-conda:26.12-latest"
      container-options:
        description: |
          Command-line arguments passed to 'docker run' when starting the container this workflow runs in.
          This should be provided as a single string to be inlined into 'docker run', not an array.
          For example, '--quiet --ulimit nofile=2048'.
        required: false
        type: string
        default: "-e _NOOP"
      script:
        required: false
        type: string
        description: "Shell code to be executed in a step. Ideally this should just invoke a script managed in the repo the workflow runs from, like 'ci/test_java.sh'."
      file_to_upload:
        description: |
          Path to file(s) to be uploaded as a CI artifact.
          If a directory is provided, all files in it will be bundled into a zip archive.
          See 'path' input at https://github.com/actions/upload-artifact?tab=readme-ov-file#inputs
        type: string
        default: "gh-status.json"
      artifact-name:
        description: |
          Identifier for the GitHub Actions artifact created by uploading ``file_to_upload``.
          See 'name' input at https://github.com/actions/upload-artifact?tab=readme-ov-file#inputs
        type: string
        default: "result"
      continue-on-error:
        description: |
          If false (the default), treat job failures as workflow failures.
          If true, job failures do not result in workflow failures (useful for implementing optional CI workflows).
          See https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idcontinue-on-error
        type: boolean
        required: false
        default: false
      build_workflow_name:
        description: |
          Name of a workflow file that produced artifacts to be downloaded in this run.
          If not set (the default), artifact-handling scripts use RAPIDS-conventional defaults (like "build.yaml" when "build_type == nightly").
        required: false
        type: string
      sccache-dist-request-timeout:
        type: string
        default: 7140
        description: |
          The maximum time (in seconds) the sccache client should wait for a distributed compilation to complete.
      sccache-dist-token-secret-name:
        type: string
        required: false
        description: |
          The name of the secret that contains the token used to authenticate with the RAPIDS Build Engineering sccache-dist build cluster.
      alternative-gh-token-secret-name:
        type: string
        required: false
        description: |
          If provided, should contain the name of a secret in the repo which holds a GitHub API token.
          When this is non-empty, that secret's value is used in place of the default repo-level token
          anywhere that environment variable GH_TOKEN is set. This is especially useful for downloading
          artifacts from other private repos, which repo tokens do not have access to.
      requires_license_builder:
        description: "Whether to ensure license builder scripts are provided in 'tools/'"
        default: false
        type: boolean
        required: false
      release-catalog-config:
        description: >-
          Optional JSON configuration for the shared-actions release catalog action. In release-candidate mode,
          it writes the declared files and evidence to the private candidate store. See
          https://github.com/rapidsai/shared-actions/tree/main/release-catalog for configuration details.
        default: ''
        type: string
        required: false
      candidate-train-sha256:
        description: "Canonical SHA-256 of the release train; required for release-candidate builds."
        type: string
        default: ""
      candidate-docs:
        description: "Prepare candidate Conda/Maven dependencies and stage RAPIDS_DOCS_DIR as a local catalog archive."
        type: boolean
        default: false
      candidate-dependency-family:
        description: "Optional release family whose declared upstream candidate dependencies this job needs (conda, wheel, maven, docs, or container)."
        type: string
        default: ''
      candidate-unit-id:
        description: "Exact release-train unit ID when it differs from <family>:<repository>."
        type: string
        default: ''
      candidate-prepare-conda-channel:
        description: "Build a local private Conda channel from exact train dependencies."
        type: boolean
        default: false
      candidate-docs-directory:
        description: "Rendered documentation directory to archive after the custom build script completes."
        type: string
        default: build/dirhtml
      candidate-skip-github-artifact-upload:
        description: "Skip the duplicate GitHub artifact upload when release-candidate output is cataloged to the private store."
        type: boolean
        default: false
      candidate-cuda-version:
        description: "CUDA version used to resolve candidate dependencies for this job matrix."
        type: string
        default: ""
      candidate-python-version:
        description: "Python version used to resolve candidate Conda dependencies for a documentation job."
        type: string
        default: ""

defaults:
  run:
    shell: bash

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  discussions: none
  id-token: write
  issues: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  build:
    # Package-only candidate pilot; retain the project's static/dynamic tests.
    if: ${{ github.event.inputs.build_type != 'release-candidate' || inputs.script != 'ci/build_docs.sh' || inputs.candidate-docs }}
    strategy:
      fail-fast: false
    runs-on: "linux-${{ inputs.arch }}-${{ inputs.node_type }}"
    continue-on-error: ${{ inputs.continue-on-error }}
    env:
      RAPIDS_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
    container:
      image: ${{ inputs.container_image }} # zizmor: ignore[unpinned-images]
      options: ${{ inputs.container-options }}
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
        # Candidate orchestration retains its own input mode, while RAPIDS
        # build helpers use the established nightly dependency behavior.
        RAPIDS_BUILD_TYPE: ${{ inputs.build_type == 'release-candidate' && 'nightly' || inputs.build_type }}
        RAPIDS_RELEASE_CANDIDATE: ${{ inputs.build_type == 'release-candidate' }}
        RAPIDS_DATETIME_STRING: ${{ inputs.build-datetime }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: ${{ inputs.build_type != 'release-candidate' && github.event.inputs.build_type != 'release-candidate' && !(github.ref_type == 'branch' && startsWith(github.ref_name, 'release-test-')) && !startsWith(github.head_ref, 'release-test-') }}
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200 # 12h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select frozen release-candidate source version
        if: ${{ inputs.build_type == 'release-candidate' && !inputs.candidate-docs }}
        run: |
          if [[ ! -f VERSION ]]; then
            echo "release-candidate source checkout has no VERSION file" >&2
            exit 1
          fi
          IFS= read -r source_version < VERSION
          version="${source_version}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+$ ]]; then
            version="${version}.00"
          elif [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release-candidate VERSION must contain two or three numeric components: ${version}" >&2
            exit 1
          fi
          {
            echo "RAPIDS_RELEASE_CANDIDATE_SOURCE_VERSION=${source_version}"
            echo "RAPIDS_RELEASE_CANDIDATE_VERSION=${version}"
          } >> "${GITHUB_ENV}"
      # Resolve before custom code runs; unknown custom jobs fail closed.
      - name: Configure candidate context credentials
        if: ${{ inputs.build_type == 'release-candidate' }}
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600 # 1h, the producer role's maximum session duration
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-producer-${{ github.repository_id }}
      - name: Resolve controller-bound candidate metadata
        id: candidate-context
        if: ${{ inputs.build_type == 'release-candidate' && inputs.candidate-train-sha256 == '' }}
        uses: rapidsai/shared-actions/release-candidate-context@9c89b865c51b05cb19a82ede92d840e0e23b84e1
        with:
          source-sha: ${{ inputs.sha || github.sha }}
          script: ${{ inputs.script }}
      - name: Install frozen release-candidate version helper
        if: ${{ inputs.build_type == 'release-candidate' && !inputs.candidate-docs }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rapidsai/gha-tools
          ref: 4ad4c79d92c1a198efc5217e09af8ba203c2d502
          path: candidate-gha-tools
          persist-credentials: false
      - name: Select frozen release-candidate version helper
        if: ${{ inputs.build_type == 'release-candidate' && !inputs.candidate-docs }}
        run: echo "${GITHUB_WORKSPACE}/candidate-gha-tools/tools" >> "${GITHUB_PATH}"
      - name: Telemetry setup
        uses: rapidsai/shared-actions/telemetry-dispatch-setup@main
        continue-on-error: true
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        env:
          # DOES NOT NEED alternative-gh-token-secret-name - github.token is enough and more limited
          GH_TOKEN: ${{ github.token }}
      - name: Setup proxy cache
        uses: nv-gha-runners/setup-proxy-cache@main
        continue-on-error: true
        with:
          enable-apt: true
          enable-conda: true
          enable-pip: true
          enable-pypi-anaconda: true
      - name: Get PR Info
        if: startsWith(github.ref_name, 'pull-request/')
        id: get-pr-info
        uses: nv-gha-runners/get-pr-info@main
      - name: Add PR Info
        if: startsWith(github.ref_name, 'pull-request/')
        run: | # zizmor: ignore[template-injection]
          echo "RAPIDS_BASE_BRANCH=${{ fromJSON(steps.get-pr-info.outputs.pr-info).base.ref }}" >> "${GITHUB_ENV}"
      - name: Standardize repository information
        uses: rapidsai/shared-actions/rapids-github-info@main
        with:
          repo: ${{ inputs.repo }}
          branch: ${{ inputs.branch }}
          date: ${{ inputs.date }}
          sha: ${{ inputs.sha }}
          build_workflow_name: ${{ inputs.build_workflow_name }}
      - name: Configure candidate dependency store credentials
        if: ${{ inputs.build_type == 'release-candidate' && (inputs.candidate-docs || inputs.candidate-dependency-family != '') }}
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600 # 1h, the producer role's maximum session duration
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-producer-${{ github.repository_id }}
      - name: Prepare candidate dependencies and build policy
        if: ${{ inputs.build_type == 'release-candidate' && (inputs.candidate-docs || inputs.candidate-dependency-family != '') }}
        uses: rapidsai/shared-actions/release-candidate-dependencies@9c89b865c51b05cb19a82ede92d840e0e23b84e1
        with:
          candidate-train-sha256: ${{ inputs.candidate-train-sha256 || steps.candidate-context.outputs.train-sha256 }}
          prepare-conda-channel: ${{ inputs.candidate-prepare-conda-channel || inputs.candidate-docs }}
          artifact-family: ${{ inputs.candidate-docs && 'docs' || inputs.candidate-dependency-family }}
          candidate-unit-id: ${{ inputs.candidate-unit-id }}
          arch: ${{ inputs.arch }}
          cuda-version: ${{ inputs.candidate-cuda-version }}
          python-version: ${{ inputs.candidate-python-version }}
      # Candidate builds avoid the general CI role until a cache-only role is
      # available. The producer role is limited to private candidate data.
      - name: Setup sccache-dist
        if: ${{ inputs.build_type != 'release-candidate' && github.event.inputs.build_type != 'release-candidate' && !(github.ref_type == 'branch' && startsWith(github.ref_name, 'release-test-')) && !startsWith(github.head_ref, 'release-test-') }}
        uses: rapidsai/shared-actions/setup-sccache-dist@main
        env:
          AWS_REGION: "${{env.AWS_REGION}}"
          AWS_ACCESS_KEY_ID: "${{env.AWS_ACCESS_KEY_ID}}"
          AWS_SECRET_ACCESS_KEY: "${{env.AWS_SECRET_ACCESS_KEY}}"
        with:
          log-file: "${{ env.RAPIDS_ARTIFACTS_DIR }}/sccache.log"
          request-timeout: ${{ inputs.sccache-dist-request-timeout }}
      # Per the docs at https://docs.github.com/en/rest/rate-limit/rate-limit?apiVersion=2022-11-28#get-rate-limit-status-for-the-authenticated-user,
      # checking '/rate_limit | jq .' should not itself count against any rate limits.
      #
      # gh CLI is pre-installed on Github-hosted runners, but may not be on self-hosted runners.
      - name: Check GitHub API rate limits
        run: |
          if ! type gh >/dev/null; then
              echo "'gh' CLI is not installed... skipping rate-limits check"
          else
              gh api /rate_limit | jq .
          fi
        env:
          # NEEDS alternative-gh-token-secret_name - API limits need to be for whatever token is used for upload/download. Repo token may be a different pool for rate limits.
          GH_TOKEN: ${{ inputs.alternative-gh-token-secret-name && secrets[inputs.alternative-gh-token-secret-name] || github.token }} # zizmor: ignore[overprovisioned-secrets]
      - name: Get RAPIDS License Builder
        if: ${{ inputs.requires_license_builder }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "rapidsai/spdx-license-builder"
          ref: "refs/heads/main"
          path: "./tool/"
          fetch-depth: 0
          persist-credentials: false
      - name: Stage candidate documentation privately
        if: ${{ inputs.build_type == 'release-candidate' && inputs.candidate-docs }}
        uses: rapidsai/shared-actions/release-candidate-docs@9c89b865c51b05cb19a82ede92d840e0e23b84e1
        with:
          candidate-train-sha256: ${{ inputs.candidate-train-sha256 || steps.candidate-context.outputs.train-sha256 }}
      - name: Set up uv for candidate documentation
        if: ${{ inputs.build_type == 'release-candidate' && inputs.candidate-docs }}
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false
      - name: Set candidate documentation matrix
        if: ${{ inputs.build_type == 'release-candidate' && inputs.candidate-docs }}
        run: |
          echo "RAPIDS_CUDA_VERSION=${CANDIDATE_CUDA_VERSION}" >>"${GITHUB_ENV}"
          echo "RAPIDS_PY_VERSION=${CANDIDATE_PYTHON_VERSION}" >>"${GITHUB_ENV}"
        env:
          CANDIDATE_CUDA_VERSION: ${{ inputs.candidate-cuda-version }}
          CANDIDATE_PYTHON_VERSION: ${{ inputs.candidate-python-version }}
      - name: Run script
        run: |
          ulimit -n "$(ulimit -Hn)"
          $INPUTS_SCRIPT
        env:
          # NEEDS alternative-gh-token-secret-name - may require a token with more permissions
          GH_TOKEN: ${{ inputs.alternative-gh-token-secret-name && secrets[inputs.alternative-gh-token-secret-name] || github.token }} # zizmor: ignore[overprovisioned-secrets]
          INPUTS_SCRIPT: ${{ inputs.script }}
          # opt out of conda sharded repodata
          #
          # TODO: remove these when this is resolved: https://github.com/conda/infrastructure/issues/1286#issuecomment-4628580232
          CONDA_PLUGINS_USE_SHARDED_REPODATA: false
          MAMBA_USE_SHARDED_REPODATA: false
          RATTLER_SHARDED: false
          RAPIDS_DOCS_PUBLISH: ${{ inputs.build_type == 'release-candidate' && inputs.candidate-docs && 'false' || 'true' }}
      - name: Archive candidate documentation
        if: ${{ inputs.build_type == 'release-candidate' && inputs.candidate-docs }}
        run: RAPIDS_DOCS_DIR="${DOCS_DIRECTORY}" rapids-upload-docs
        env:
          DOCS_DIRECTORY: ${{ inputs.candidate-docs-directory }}
      - name: Upload file to GitHub Artifact
        if: ${{ !inputs.candidate-skip-github-artifact-upload && (inputs.build_type != 'release-candidate' || steps.candidate-context.outputs.custom-mode == 'artifact') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.file_to_upload }}
          if-no-files-found: ignore
      - name: Configure release-candidate store credentials
        if: ${{ inputs.build_type == 'release-candidate' && inputs.release-catalog-config != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600 # 1h, the producer role's maximum session duration
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-producer-${{ github.repository_id }}
      - name: Create release catalog companion
        if: ${{ inputs.build_type == 'release-candidate' && inputs.release-catalog-config != '' }}
        uses: rapidsai/shared-actions/release-catalog-dispatch@9c89b865c51b05cb19a82ede92d840e0e23b84e1
        with:
          config: ${{ inputs.release-catalog-config }}
          source-artifact-name: ${{ inputs.artifact-name }}
          candidate-train-sha256: ${{ inputs.candidate-train-sha256 || steps.candidate-context.outputs.train-sha256 }}
          upload-to-s3: 'true'
          candidate-matrix-arch: ${{ inputs.arch }}
          candidate-matrix-cuda-version: ${{ inputs.candidate-cuda-version }}
          candidate-matrix-python-version: ${{ inputs.candidate-python-version }}
      - name: Upload additional artifacts
        if: ${{ !cancelled() && inputs.build_type != 'release-candidate' }}
        run: rapids-upload-artifacts-dir "custom-job-$(arch)"
      - name: Telemetry upload attributes
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-job-artifacts@main
        continue-on-error: true
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        env:
          # DOES NOT NEED alternative-gh-token-secret-name - github.token is enough and more limited
          GH_TOKEN: ${{ github.token }}
