on:
  workflow_call:
    inputs:
      build_type:
        description: "One of: [branch, nightly, pull-request, release-candidate]"
        required: true
        type: string
      branch:
        description: |
          Git branch the workflow run targets.
          This is required even when 'sha' is provided because it is also used for organizing artifacts.
        type: string
      date:
        description: "Date (YYYY-MM-DD) this run is for. Used to organize artifacts produced by nightly builds"
        type: string
      sha:
        description: "Full git commit SHA to check out"
        type: string
      build-datetime:
        description: |
          date-time to be used in build strings.
          Unlike input 'date' (set in the call to the calling workflow), this is computed at runtime
          by the calling workflow.
        default: null
        required: false
        type: string
      repo:
        description: "Git repo to check out, in '{org}/{repo}' form, e.g. 'rapidsai/cudf'"
        type: string
      arch:
        description: "One of [amd64, arm64]. CPU architecture to run on."
        type: string
        default: "amd64"
      node_type:
        description: |
          Suffix, without leading '-', indicating the type of machine to run jobs on (e.g., 'cpu4' or 'gpu-l4-latest-1').
          Runner labels are of the form '{operating_system}-{arch}-{node_type}'.
          See https://github.com/nv-gha-runners/enterprise-runner-configuration/blob/main/docs/runner-groups.md for a list
          of valid values.
        type: string
        default: "cpu8"
      container_image:
        description: "Container image URI"
        type: string
        default: "rapidsai/ci-conda:26.12-latest"
      container-options:
        description: |
          Command-line arguments passed to 'docker run' when starting the container this workflow runs in.
          This should be provided as a single string to be inlined into 'docker run', not an array.
          For example, '--quiet --ulimit nofile=2048'.
        required: false
        type: string
        default: "-e _NOOP"
      script:
        required: false
        type: string
        description: "Shell code to be executed in a step. Ideally this should just invoke a script managed in the repo the workflow runs from, like 'ci/test_java.sh'."
      file_to_upload:
        description: |
          Path to file(s) to be uploaded as a CI artifact.
          If a directory is provided, all files in it will be bundled into a zip archive.
          See 'path' input at https://github.com/actions/upload-artifact?tab=readme-ov-file#inputs
        type: string
        default: "gh-status.json"
      artifact-name:
        description: |
          Identifier for the GitHub Actions artifact created by uploading ``file_to_upload``.
          See 'name' input at https://github.com/actions/upload-artifact?tab=readme-ov-file#inputs
        type: string
        default: "result"
      candidate-artifact-name:
        description: "Safe, matrix-unique source name for this job's private candidate catalog entry."
        type: string
        default: ''
      continue-on-error:
        description: |
          If false (the default), treat job failures as workflow failures.
          If true, job failures do not result in workflow failures (useful for implementing optional CI workflows).
          See https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idcontinue-on-error
        type: boolean
        required: false
        default: false
      build_workflow_name:
        description: |
          Name of a workflow file that produced artifacts to be downloaded in this run.
          If not set (the default), artifact-handling scripts use RAPIDS-conventional defaults (like "build.yaml" when "build_type == nightly").
        required: false
        type: string
      sccache-dist-request-timeout:
        type: string
        default: 7140
        description: |
          The maximum time (in seconds) the sccache client should wait for a distributed compilation to complete.
      sccache-dist-token-secret-name:
        type: string
        required: false
        description: |
          The name of the secret that contains the token used to authenticate with the RAPIDS Build Engineering sccache-dist build cluster.
      alternative-gh-token-secret-name:
        type: string
        required: false
        description: |
          If provided, should contain the name of a secret in the repo which holds a GitHub API token.
          When this is non-empty, that secret's value is used in place of the default repo-level token
          anywhere that environment variable GH_TOKEN is set. This is especially useful for downloading
          artifacts from other private repos, which repo tokens do not have access to.
      requires_license_builder:
        description: "Whether to ensure license builder scripts are provided in 'tools/'"
        default: false
        type: boolean
        required: false
      release-catalog-config:
        description: >-
          Optional JSON configuration for the shared-actions release catalog action. In release-candidate mode,
          it writes the declared files and evidence to the private candidate store. See
          https://github.com/rapidsai/shared-actions/tree/main/release-catalog for configuration details.
        default: ''
        type: string
        required: false
      candidate-train-sha256:
        description: "Canonical SHA-256 of the release train; required for release-candidate builds."
        type: string
        default: ""
      candidate-docs:
        description: "Prepare candidate Conda/Maven dependencies and stage RAPIDS_DOCS_DIR as a local catalog archive."
        type: boolean
        default: false
      candidate-dependency-family:
        description: "Optional release family whose declared upstream candidate dependencies this job needs (conda, wheel, maven, docs, or container)."
        type: string
        default: ''
      candidate-unit-id:
        description: "Exact release-train unit ID when it differs from <family>:<repository>."
        type: string
        default: ''
      candidate-prepare-conda-channel:
        description: "Build a local private Conda channel from exact train dependencies."
        type: boolean
        default: false
      candidate-docs-directory:
        description: "Rendered documentation directory to archive after the custom build script completes."
        type: string
        default: build/dirhtml
      candidate-skip-github-artifact-upload:
        description: "Skip the duplicate GitHub artifact upload when release-candidate output is cataloged to the private store."
        type: boolean
        default: false
      candidate-cuda-version:
        description: "CUDA version used to resolve candidate dependencies for this job matrix."
        type: string
        default: ""
      candidate-python-version:
        description: "Python version used to resolve candidate Conda dependencies for a documentation job."
        type: string
        default: ""

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  discussions: none
  id-token: write
  issues: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  validate:
    uses: ./.github/workflows/evaluate-build-policy.yaml
    permissions: {}
    with:
      inputs-json: ${{ toJSON(inputs) }}
      validate-inputs: true
      custom-job: true
      candidate-defaults-json: >-
        {
          "candidate-artifact-name": "",
          "release-catalog-config": "",
          "candidate-train-sha256": "",
          "candidate-docs": false,
          "candidate-dependency-family": "",
          "candidate-unit-id": "",
          "candidate-prepare-conda-channel": false,
          "candidate-docs-directory": "build/dirhtml",
          "candidate-skip-github-artifact-upload": false,
          "candidate-cuda-version": "",
          "candidate-python-version": ""
        }
  ci:
    needs: validate
    if: ${{ needs.validate.outputs.run-ci == 'true' }}
    uses: ./.github/workflows/custom-job-ci.yaml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      build_type: ${{ inputs.build_type }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      build-datetime: ${{ inputs.build-datetime }}
      repo: ${{ inputs.repo }}
      arch: ${{ inputs.arch }}
      node_type: ${{ inputs.node_type }}
      container_image: ${{ inputs.container_image }}
      container-options: ${{ inputs.container-options }}
      script: ${{ inputs.script }}
      file_to_upload: ${{ inputs.file_to_upload }}
      artifact-name: ${{ inputs.artifact-name }}
      continue-on-error: ${{ inputs.continue-on-error }}
      build_workflow_name: ${{ inputs.build_workflow_name }}
      sccache-dist-request-timeout: ${{ inputs.sccache-dist-request-timeout }}
      sccache-dist-token-secret-name: ${{ inputs.sccache-dist-token-secret-name }}
      alternative-gh-token-secret-name: ${{ inputs.alternative-gh-token-secret-name }}
      requires_license_builder: ${{ inputs.requires_license_builder }}
  candidate:
    needs: validate
    if: ${{ needs.validate.outputs.run-candidate == 'true' }}
    uses: ./.github/workflows/custom-job-candidate.yaml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      build-datetime: ${{ inputs.build-datetime }}
      repo: ${{ inputs.repo }}
      arch: ${{ inputs.arch }}
      node_type: ${{ inputs.node_type }}
      container_image: ${{ inputs.container_image }}
      container-options: ${{ inputs.container-options }}
      script: ${{ inputs.script }}
      file_to_upload: ${{ inputs.file_to_upload }}
      artifact-name: ${{ inputs.artifact-name }}
      candidate-artifact-name: ${{ inputs.candidate-artifact-name }}
      continue-on-error: ${{ inputs.continue-on-error }}
      build_workflow_name: ${{ inputs.build_workflow_name }}
      sccache-dist-request-timeout: ${{ inputs.sccache-dist-request-timeout }}
      sccache-dist-token-secret-name: ${{ inputs.sccache-dist-token-secret-name }}
      alternative-gh-token-secret-name: ${{ inputs.alternative-gh-token-secret-name }}
      requires_license_builder: ${{ inputs.requires_license_builder }}
      release-catalog-config: ${{ inputs.release-catalog-config }}
      candidate-train-sha256: ${{ inputs.candidate-train-sha256 }}
      candidate-docs: ${{ inputs.candidate-docs }}
      candidate-dependency-family: ${{ inputs.candidate-dependency-family }}
      candidate-unit-id: ${{ inputs.candidate-unit-id }}
      candidate-prepare-conda-channel: ${{ inputs.candidate-prepare-conda-channel }}
      candidate-docs-directory: ${{ inputs.candidate-docs-directory }}
      candidate-skip-github-artifact-upload: ${{ inputs.candidate-skip-github-artifact-upload }}
      candidate-cuda-version: ${{ inputs.candidate-cuda-version }}
      candidate-python-version: ${{ inputs.candidate-python-version }}
