name: Build RAPIDS wheels

on:
  workflow_call:
    inputs:
      branch:
        description: |
          Git branch the workflow run targets.
          This is required even when 'sha' is provided because it is also used for organizing artifacts.
        type: string
      date:
        description: "Date (YYYY-MM-DD) this run is for. Used to organize artifacts produced by nightly builds"
        type: string
      sha:
        description: "Full git commit SHA to check out"
        type: string
      build-datetime:
        description: |
          date-time to be used in build strings.
          Unlike input 'date' (set in the call to the calling workflow), this is computed at runtime
          by the calling workflow.
        default: null
        required: false
        type: string
      repo:
        description: "Git repo to check out, in '{org}/{repo}' form, e.g. 'rapidsai/cudf'"
        type: string
      candidate-producer-repository-id:
        description: |
          Numeric GitHub ID of the producer repository whose candidate-store role to assume.
          Leave empty when the workflow runs inside the producer repository (the role then comes from
          github.repository_id). Set it only for train-generated builds that run in another repository.
          IAM remains the authority: a wrong ID names a role that does not trust the caller and is denied.
        type: string
        default: ''
      candidate-role:
        description: |
          Which candidate-store role to assume: 'producer' (default; the producer's own role) or
          'release-build' (the one role trusted only for the release workflow on release-tracking main).
          'release-build' requires candidate-producer-repository-id. Any other value fails the policy job.
        type: string
        default: 'producer'
      candidate-python-versions:
        description: |
          Optional comma-separated Python versions for release candidates (for example '3.12'); other versions
          are removed from the matrix before matrix_filter. Empty keeps every version.
        type: string
        default: ''
      script:
        required: true
        type: string
        description: "Shell code to be executed in a step. Ideally this should just invoke a script managed in the repo the workflow runs from, like 'ci/build_wheel.sh'."
      package-name:
        required: true
        type: string
        description: "Distribution name, without any other qualifiers (e.g. 'pylibcudf', not 'pylibcudf-cu12-cp311-manylinux_2_24_aarch64')"
      package-type:
        description: "One of: [cpp, python]"
        required: true
        type: string
      pure-wheel:
        required: false
        type: boolean
        default: false
        description: "One of [true, false], true if the wheel is not dependent on operating system, Python minor version, or CPU architecture"
      append-cuda-suffix:
        required: false
        type: boolean
        default: true
        description: "One of [true, false] to indicate if CUDA version should be appended to the wheel name"

      # allow a bigger runner instance
      node_type:
        description: |
          Suffix, without leading '-', indicating the type of machine to run jobs on (e.g., 'cpu4' or 'gpu-l4-latest-1').
          Runner labels are of the form '{operating_system}-{arch}-{node_type}'.
          See https://github.com/nv-gha-runners/enterprise-runner-configuration/blob/main/docs/runner-groups.md for a list
          of valid values.
        required: false
        type: string
        default: "cpu16"

      # general settings
      matrix_type:
        description: "One or more comma-separated matrix types defined for this workflow's matrix in .github/actions/prepare-matrix/matrix.yaml, e.g. 'pull-request' or 'nightly'. Defaults to 'auto', which must be used alone and means 'choose a value based on what's provided via build_type'."
        required: false
        type: string
        default: "auto"
      matrix_filter:
        description: |
          jq expression which modifies the matrix.
          For example, 'map(select(.ARCH == "amd64"))' to achieve "only run amd64 jobs".
        type: string
        default: "."
      upload-artifacts:
        type: boolean
        default: true
        required: false
        description: "One of [true, false], true if artifacts should be uploaded to GitHub's artifact store"
      candidate-train-sha256:
        description: "Canonical SHA-256 of the release train; required for release-candidate builds."
        type: string
        default: ""
      extra-repo:
        required: false
        type: string
        default: ''
        description: "Extra repository that will be cloned into the project directory."
      extra-repo-sha:
        required: false
        type: string
        default: ''
        description: "Commit SHA in 'extra-repo' to clone."
      extra-repo-deploy-key:
        required: false
        type: string
        default: ''
        description: "The _name_ of a secret containing a deploy key for 'extra-repo' (not the key itself)."
      sccache-dist-request-timeout:
        type: string
        default: 7140
        description: |
          The maximum time (in seconds) the sccache client should wait for a distributed compilation to complete.
      sccache-dist-token-secret-name:
        type: string
        required: false
        description: |
          The name of the secret that contains the token used to authenticate with the RAPIDS Build Engineering sccache-dist build cluster.
      alternative-gh-token-secret-name:
        type: string
        required: false
        description: |
          If provided, should contain the name of a secret in the repo which holds a GitHub API token.
          When this is non-empty, that secret's value is used in place of the default repo-level token
          anywhere that environment variable GH_TOKEN is set. This is especially useful for downloading
          artifacts from other private repos, which repo tokens do not have access to.
      cache-paths:
        type: string
        required: false
        default: ""
        description: |
          Newline-separated workspace-relative files or directories to persist with actions/cache.
          Workspace-relative paths are required for cache saves from job containers. Must be provided
          together with cache-key-prefix.
      cache-key-prefix:
        type: string
        required: false
        default: ""
        description: |
          Prefix for the actions/cache key for cache-paths. The workflow appends its matrix identity
          so caches are not shared across incompatible runners or environments.
      cache-key-files:
        type: string
        required: false
        default: ""
        description: |
          Newline-separated tracked files or glob patterns to hash into the cache key. Use this for caches
          that must be saved again when relevant source or dependency files change.
      cache-key-matrix-fields:
        type: string
        required: false
        default: |
          CUDA_VER
          PY_VER
          ARCH
          LINUX_VER
        description: |
          Newline-separated matrix fields that scope the caller cache key. Override only when the
          cache is known to be independent of one of this workflow's default compatibility fields.
      cache-environment:
        type: string
        required: false
        default: ""
        description: |
          Newline-separated literal NAME=VALUE pairs exported before the caller script runs.
          Use workspace-relative paths for directories managed by cache-paths.
      cache-read-only:
        type: boolean
        required: false
        default: false
        description: |
          Restore caller cache paths without saving them at job completion. Use this for
          short-lived refs that should consume a cache maintained by a trusted ref.

defaults:
  run:
    shell: bash

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  discussions: none
  id-token: write
  issues: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  policy:
    uses: $/.github/workflows/evaluate-build-policy.yaml
    permissions: {}
    with:
      inputs-json: ${{ toJSON(inputs) }}
      build-type: release-candidate
  compute-matrix:
    uses: $/.github/workflows/compute-matrix.yaml
    with:
      python_versions: ${{ inputs.candidate-python-versions }}
      build_type: release-candidate
      matrix_name: wheels-build
      matrix_type: ${{ inputs.matrix_type }}
      matrix_filter: ${{ inputs.matrix_filter }}
      pure_wheel: ${{ inputs.pure-wheel }}
  build:
    name: ${{ matrix.CUDA_VER }}, ${{ matrix.PY_VER }}, ${{ matrix.ARCH }}, ${{ matrix.LINUX_VER }}
    needs: [compute-matrix, policy]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    runs-on: "linux-${{ matrix.ARCH }}-${{ inputs.node_type }}"
    env:
      RAPIDS_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
    container:
      image: "rapidsai/ci-wheel:26.12-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      env:
        # Candidate orchestration retains its own input mode, while RAPIDS
        # build helpers use the established nightly dependency behavior.
        RAPIDS_BUILD_TYPE: nightly
        RAPIDS_RELEASE_CANDIDATE: true
        RAPIDS_DATETIME_STRING: ${{ inputs.build-datetime }}
    steps:
      - name: checkout code repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup caller cache
        if: ${{ needs.policy.outputs.caller-cache == 'true' }}
        uses: rapidsai/shared-actions/setup-caller-cache@59a896a988a876882b2b9d9f32eefcb81cafc411
        with:
          cache-paths: ${{ inputs.cache-paths }}
          cache-key-prefix: ${{ inputs.cache-key-prefix }}
          cache-key-files: ${{ inputs.cache-key-files }}
          cache-key-matrix-fields: ${{ inputs.cache-key-matrix-fields }}
          cache-environment: ${{ inputs.cache-environment }}
          cache-read-only: ${{ inputs.cache-read-only }}
          matrix: ${{ toJSON(matrix) }}

      - name: Standardize repository information
        uses: rapidsai/shared-actions/rapids-github-info@59a896a988a876882b2b9d9f32eefcb81cafc411
        with:
          repo: ${{ inputs.repo }}
          branch: ${{ inputs.branch }}
          date: ${{ inputs.date }}
          sha: ${{ inputs.sha }}

      - name: Preprocess extra repos
        id: preprocess-extras
        if: ${{ inputs.extra-repo != '' }}
        env:
          EXTRA_REPO: ${{ inputs.extra-repo }}
        run: |
          EXTRA_REPO_PATH=$(echo "$EXTRA_REPO" | cut -d "/"  -f 2)
          echo "EXTRA_REPO_PATH=${EXTRA_REPO_PATH}" >> "${GITHUB_OUTPUT}"

      - name: checkout extra repos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.extra-repo != '' }}
        with:
          repository: ${{ inputs.extra-repo }}
          ref: ${{ inputs.extra-repo-sha }}
          path: "./${{ steps.preprocess-extras.outputs.EXTRA_REPO_PATH }}"
          ssh-key: ${{ secrets[inputs.extra-repo-deploy-key] }} # zizmor: ignore[overprovisioned-secrets]
          persist-credentials: false

      - name: Setup proxy cache
        uses: nv-gha-runners/setup-proxy-cache@eadc57871cde0c92a223d0f486ab669a2360f978
        continue-on-error: true
        with:
          enable-apt: true
          enable-conda: true
          enable-pip: true
          enable-pypi-anaconda: true

      - name: Configure candidate dependency store credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600 # 1h, the producer role's maximum session duration
          role-to-assume: ${{ inputs.candidate-role == 'release-build' && 'arn:aws:iam::279114543810:role/gha-oidc-rc-release-build' || format('arn:aws:iam::279114543810:role/gha-oidc-rc-producer-{0}', inputs.candidate-producer-repository-id || github.repository_id) }}
      # Resolve controller-bound candidate metadata before the build.
      - name: Resolve controller-bound candidate metadata
        id: candidate-context
        if: ${{ inputs.candidate-train-sha256 == '' }}
        uses: rapidsai/shared-actions/release-candidate-context@59a896a988a876882b2b9d9f32eefcb81cafc411
        with:
          producer-repository: ${{ inputs.candidate-producer-repository-id != '' && inputs.repo || '' }}
          producer-repository-id: ${{ inputs.candidate-producer-repository-id }}
          source-sha: ${{ env.RAPIDS_SHA }}
          audit-boundary: 'true'
      - name: Select frozen release-candidate unit version
        uses: $/.github/actions/select-candidate-version
        with:
          candidate-train-sha256: ${{ inputs.candidate-train-sha256 || steps.candidate-context.outputs.train-sha256 }}
          artifact-family: wheel
          repository: ${{ inputs.repo || github.repository }}
          source-sha: ${{ env.RAPIDS_SHA }}
      - name: Prepare candidate dependencies and build policy
        uses: rapidsai/shared-actions/release-candidate-dependencies@59a896a988a876882b2b9d9f32eefcb81cafc411
        with:
          producer-repository: ${{ inputs.candidate-producer-repository-id != '' && inputs.repo || '' }}
          producer-sha: ${{ inputs.candidate-producer-repository-id != '' && (env.RAPIDS_SHA) || '' }}
          candidate-train-sha256: ${{ inputs.candidate-train-sha256 || steps.candidate-context.outputs.train-sha256 }}
          artifact-family: wheel
          arch: ${{ matrix.ARCH }}
          cuda-version: ${{ matrix.CUDA_VER }}
          python-version: ${{ matrix.PY_VER }}
      # Candidate trains freeze candidate_build_policy.sccache, and the step
      # above exports it. When the train enables sccache, configure the same
      # sccache-dist client and OIDC-exchanged token that CI builds use;
      # without the token the build's sccache client cannot authenticate.
      - name: Setup sccache-dist
        if: ${{ env.RAPIDS_RELEASE_CANDIDATE_SCCACHE == 'true' }}
        uses: rapidsai/shared-actions/setup-sccache-dist@59a896a988a876882b2b9d9f32eefcb81cafc411
        with:
          log-file: "${{ env.RAPIDS_ARTIFACTS_DIR }}/sccache.log"
          request-timeout: ${{ inputs.sccache-dist-request-timeout }}
      - name: Check GitHub API rate limits
        run: |
          if ! type gh >/dev/null; then
              echo "'gh' CLI is not installed... skipping rate-limits check"
          else
              gh api /rate_limit | jq .
          fi
        env:
          # NEEDS alternative-gh-token-secret_name - API limits need to be for whatever token is used for upload/download. Repo token may be a different pool for rate limits.
          GH_TOKEN: ${{ inputs.alternative-gh-token-secret-name && secrets[inputs.alternative-gh-token-secret-name] || github.token }} # zizmor: ignore[overprovisioned-secrets]
      - name: Build and repair the wheel
        id: build-wheel
        run: |
          ulimit -n "$(ulimit -Hn)"
          : "${RAPIDS_RELEASE_CANDIDATE_UNIT_VERSION:?candidate unit version was not selected}"
          export SETUPTOOLS_SCM_PRETEND_VERSION="${RAPIDS_RELEASE_CANDIDATE_UNIT_VERSION}"
          # shellcheck disable=SC1090
          source "${INPUTS_SCRIPT}"

          # Capture RAPIDS_PACKAGE_NAME if set by the build script
          if [[ -n "${RAPIDS_PACKAGE_NAME:-}" ]]; then
            echo "rapids-package-name=${RAPIDS_PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"
          fi
        env:
          INPUTS_SCRIPT: "${{ inputs.script }}"
          BUILD_TYPE: release-candidate
          # NEEDS alternative-gh-token-secret-name - may require a token with more permissions
          GH_TOKEN: ${{ inputs.alternative-gh-token-secret-name && secrets[inputs.alternative-gh-token-secret-name] || github.token }} # zizmor: ignore[overprovisioned-secrets]
        # Use a shell that loads the rc file so that we get the compiler settings
        shell: bash -leo pipefail {0}

      - name: Get package name
        env:
          # Pass RAPIDS_PACKAGE_NAME from build-wheel step if available
          RAPIDS_PACKAGE_NAME: ${{ steps.build-wheel.outputs.rapids-package-name }}
          # We won't need any of these after we switch over to `rapids-package-name` everywhere
          APPEND_CUDA_SUFFIX: ${{ inputs.append-cuda-suffix }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          PACKAGE_TYPE: ${{ inputs.package-type }}
          PURE_WHEEL: ${{ inputs.pure-wheel }}
        run: |
          if [ -z "${PACKAGE_NAME}" ]; then
            PACKAGE_NAME="${RAPIDS_REPOSITORY#*/}"
          fi
          export "RAPIDS_PY_CUDA_SUFFIX=$(rapids-wheel-ctk-name-gen "${RAPIDS_CUDA_VERSION}")"
          if [ "${APPEND_CUDA_SUFFIX}" = "true" ]; then
            export "RAPIDS_PY_WHEEL_NAME=${PACKAGE_NAME}_${RAPIDS_PY_CUDA_SUFFIX}"
          else
            export "RAPIDS_PY_WHEEL_NAME=${PACKAGE_NAME}"
          fi
          if [ "${PURE_WHEEL}" = "true" ]; then
            export "RAPIDS_PY_WHEEL_PURE=1"
          fi

          # Use RAPIDS_PACKAGE_NAME from build step if available, otherwise check environment, otherwise generate default
          if [[ -n "${RAPIDS_PACKAGE_NAME:-}" ]]; then
            echo "RAPIDS_PACKAGE_NAME=${RAPIDS_PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "RAPIDS_PACKAGE_NAME=$(rapids-package-name "wheel_${PACKAGE_TYPE}")" >> "${GITHUB_OUTPUT}"
          fi
          echo "WHEEL_OUTPUT_DIR=${RAPIDS_WHEEL_BLD_OUTPUT_DIR}" >> "${GITHUB_OUTPUT}"
        id: package-name

      # A build script that builds several packages in one job (rmm's ci/build_wheel.sh: librmm, then rmm against
      # it) leaves each package's wheels in its own directory and reports it as the step output
      # <package>_output_dir. Every reported directory goes into the row's catalog artifact, under the package's
      # name; a script that reports none leaves its wheels in RAPIDS_WHEEL_BLD_OUTPUT_DIR.
      - name: Show files to be uploaded
        env:
          WHEEL_OUTPUT_DIR: ${{ steps.package-name.outputs.WHEEL_OUTPUT_DIR }}
          BUILD_OUTPUTS: ${{ toJSON(steps.build-wheel.outputs) }}
        run: |
          echo "Contents of directory to be uploaded:"
          mapfile -t directories < <(jq -r 'to_entries[] | select(.key | endswith("_output_dir")) | .value' <<<"${BUILD_OUTPUTS}")
          if (( ${#directories[@]} == 0 )); then
            directories=("${WHEEL_OUTPUT_DIR}")
          fi
          ls -R "${directories[@]}"

      - name: Stage candidate wheels for the release catalog
        env:
          WHEEL_OUTPUT_DIR: ${{ steps.package-name.outputs.WHEEL_OUTPUT_DIR }}
          BUILD_OUTPUTS: ${{ toJSON(steps.build-wheel.outputs) }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          workspace="$(realpath "${GITHUB_WORKSPACE}")"
          artifact_directory=".release-candidate-artifacts/wheels"
          # package key (empty for a single-package build) <TAB> its output directory
          mapfile -t reported < <(jq -r 'to_entries[] | select(.key | endswith("_output_dir"))
            | "\(.key | sub("_output_dir$"; ""))\t\(.value)"' <<<"${BUILD_OUTPUTS}")
          if (( ${#reported[@]} == 0 )); then
            reported=($'\t'"${WHEEL_OUTPUT_DIR}")
          fi
          # Check every directory before copying anything, so a bad one stages no partial row.
          sources=()
          for entry in "${reported[@]}"; do
            key="${entry%%$'\t'*}"
            directory="${entry#*$'\t'}"
            if (( ${#reported[@]} > 1 )) || [[ -n "${key}" ]]; then
              if [[ ! "${key}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
                echo "invalid staged package key '${key}' in the build step's outputs" >&2
                exit 1
              fi
              if ! resolved="$(realpath -e -- "${directory}")" || [[ "${resolved}" != "${workspace}/"* ]]; then
                echo "staged output directory for ${key} is missing or outside the workspace: ${directory}" >&2
                exit 1
              fi
            else
              resolved="$(realpath -- "${directory}")"
            fi
            if [[ -z "$(find "${resolved}" -type f -name '*.whl' -print -quit 2>/dev/null)" ]]; then
              echo "no wheels found under ${directory}" >&2
              exit 1
            fi
            sources+=("${key}"$'\t'"${resolved}")
          done
          for entry in "${sources[@]}"; do
            key="${entry%%$'\t'*}"
            source_directory="${entry#*$'\t'}"
            target="${artifact_directory}${key:+/${key}}"
            while IFS= read -r -d '' wheel; do
              destination="${target}/${wheel#"${source_directory}/"}"
              if [[ -e "${destination}" ]]; then
                echo "two staged wheels would both be ${destination}" >&2
                exit 1
              fi
              mkdir -p "$(dirname "${destination}")"
              cp -- "${wheel}" "${destination}"
            done < <(find "${source_directory}" -type f -name '*.whl' -print0)
          done

      - name: Configure release-candidate store credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600 # 1h, the producer role's maximum session duration
          role-to-assume: ${{ inputs.candidate-role == 'release-build' && 'arn:aws:iam::279114543810:role/gha-oidc-rc-release-build' || format('arn:aws:iam::279114543810:role/gha-oidc-rc-producer-{0}', inputs.candidate-producer-repository-id || github.repository_id) }}
      # The catalog unit is the producer's: a release-build run in release-tracking builds another
      # repository, so the calling repository's name would name a unit the train does not have.
      - name: Name the producer repository for the release catalog
        id: catalog-repository
        env:
          REPOSITORY: ${{ inputs.candidate-producer-repository-id != '' && inputs.repo || github.repository }}
        run: |
          if [[ ! "${REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/([A-Za-z0-9_.-]+)$ ]]; then
            echo "cannot name the release catalog unit for repository '${REPOSITORY}'" >&2
            exit 1
          fi
          echo "name=${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"
      - name: Create wheel release catalog companion
        uses: rapidsai/shared-actions/release-catalog-dispatch@59a896a988a876882b2b9d9f32eefcb81cafc411
        with:
          producer-repository: ${{ inputs.candidate-producer-repository-id != '' && inputs.repo || '' }}
          config: >-
            {
              "release_catalog_key": ${{ toJSON(format('wheel:{0}', steps.catalog-repository.outputs.name)) }},
              "artifact_directory": ".release-candidate-artifacts/wheels"
            }
          source-artifact-name: ${{ steps.package-name.outputs.RAPIDS_PACKAGE_NAME }}
          candidate-train-sha256: ${{ inputs.candidate-train-sha256 || steps.candidate-context.outputs.train-sha256 }}
          upload-to-s3: 'true'
          candidate-matrix-arch: ${{ matrix.ARCH }}
          candidate-matrix-cuda-version: ${{ matrix.CUDA_VER }}
          candidate-matrix-python-version: ${{ matrix.PY_VER }}
