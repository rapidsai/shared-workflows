#
# Publishes a bundle of Maven artifacts (jars, POMs, sources, javadoc). Every
# file is GPG-signed. The destination is chosen inside this workflow with
# `rapids-is-release-build`:
#   - release build (vYY.MM.PP tag) -> Maven Central via the Sonatype Central
#     Publisher Portal (OSSRH staging, validation, automatic publication).
#   - non-release build (nightly, branch push) -> Sonatype snapshot repository
#     (direct HTTP PUT, immediately available, no staging or portal step).
name: Maven publish

on:
  workflow_call:
    outputs:
      deployment-state:
        description: Maven Central deployment state; PUBLISHED authorizes dependent releases.
        value: ${{ jobs.maven-publish.outputs.deployment-state }}
      deployment-id:
        description: Sonatype Portal deployment ID for release recovery.
        value: ${{ jobs.maven-publish.outputs.deployment-id }}
      version:
        description: Maven version read from the published POM.
        value: ${{ jobs.maven-publish.outputs.version }}
    inputs:
      artifact-name:
        description: |
          Name of the GitHub Actions artifact (uploaded by the caller job via
          actions/upload-artifact) to download and publish. Contents must be
          a Maven repository directory.
        required: true
        type: string
      build_type:
        description: Build type; release candidates must not publish Maven artifacts.
        required: false
        type: string
        default: ''
      branch:
        description: Git branch the workflow run targets.
        required: false
        type: string
        default: ''
      docs-project:
        description: |
          Optional registered Java docs project in rapidsai/docs, e.g. cudf-java.
          Retain a completed-publication receipt after PUBLISHED. The standalone
          dispatcher in release-tracking starts docs using its existing App.
        required: false
        type: string
        default: ''
      source-git-sha:
        description: |
          Git SHA to include in the retained bundle name for provenance.
        required: false
        type: string
        default: ''
      profile-id:
        description: |
          Sonatype staging profile to search, if different from the Maven groupId read from
          the POM (e.g. a verified parent namespace like com.nvidia for a com.nvidia.cuopt
          groupId). Defaults to the groupId when not set. Only applies to the Maven Central
          path (release builds); ignored on the snapshot path.
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash

permissions:
  actions: read
  contents: read

jobs:
  policy:
    uses: ./.github/workflows/evaluate-build-policy.yaml
    permissions: {}
    with:
      inputs-json: ${{ toJSON(inputs) }}
  maven-publish:
    name: maven publish
    needs: policy
    if: ${{ needs.policy.outputs.allow-publication == 'true' }}
    environment: public-publication
    runs-on: linux-amd64-cpu4
    concurrency:
      group: maven-central-${{ github.repository }}-${{ inputs.artifact-name }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.prepare.outputs.VERSION }}
      deployment-state: ${{ steps.publish-central.outputs.DEPLOYMENT_STATE }}
      deployment-id: ${{ steps.publish-central.outputs.DEPLOYMENT_ID }}
    steps:
      - name: Self-checkout shared-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: shared-workflows
          persist-credentials: false

      - name: Install gha-tools
        run: |
          # rapids-is-release-build lives in rapidsai/gha-tools. Fetch the
          # release tarball and add it to PATH so the release check below
          # (and any downstream steps) can find it.
          mkdir -p /tmp/gha-tools
          wget -qO- https://github.com/rapidsai/gha-tools/releases/latest/download/tools.tar.gz \
            | tar -xz -C /tmp/gha-tools
          echo "/tmp/gha-tools" >> "${GITHUB_PATH}"

      - name: Determine publish destination
        id: destination
        run: |
          if rapids-is-release-build; then
            echo "is_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Find retained deployment from an earlier attempt
        id: receipt
        if: ${{ steps.destination.outputs.is_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_NAME: maven-central-deployment-${{ inputs.artifact-name }}-${{ github.run_id }}
          PUBLICATION_NAME: maven-central-published-${{ inputs.docs-project }}
        run: |
          artifacts=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")
          ids=$(jq -er --arg name "${RECEIPT_NAME}" \
              '[.[].artifacts[] | select(.name == $name and .expired == false)]
               | if length <= 1 then (.[0].id // "") else error("duplicate receipts") end' <<< "${artifacts}")
          echo "artifact-id=${ids}" >> "${GITHUB_OUTPUT}"
          published=$(jq -er --arg name "${PUBLICATION_NAME}" \
            '[.[].artifacts[] | select(.name == $name and .expired == false)]
             | if length <= 1 then (.[0].id // "") else error("duplicate publication receipts") end' <<< "${artifacts}")
          echo "published-artifact-id=${published}" >> "${GITHUB_OUTPUT}"

      - name: Restore retained deployment
        if: ${{ steps.receipt.outputs.artifact-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.receipt.outputs.artifact-id }}
          path: deployment-receipt
          merge-multiple: true

      - name: Download Maven repository artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: maven-repo

      - name: Prepare signed Maven bundle
        id: prepare
        run: |
          shared-workflows/ci/maven-publish/prepare_maven_bundle.sh \
            --input maven-repo \
            --output signed-maven-repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload to Maven Central
        id: publish-central
        if: ${{ steps.destination.outputs.is_release == 'true' }}
        run: |
          if [[ -n ${DOCS_PROJECT} ]]; then
            shared-workflows/ci/maven-publish/write_maven_publication_receipt.sh --validate
          fi
          mkdir -p deployment-receipt
          args=(
            --input signed-maven-repo
            --group-id "${GROUP_ID}"
            --artifact-id "${ARTIFACT_ID}"
            --version "${VERSION}"
            --output-bundle central-bundle.zip
            --deployment-receipt deployment-receipt/deployment.json
          )
          if [[ -n ${PROFILE_ID} ]]; then
            args+=(--profile-id "${PROFILE_ID}")
          fi
          shared-workflows/ci/maven-publish/maven_central_publish.sh "${args[@]}"
        env:
          GROUP_ID: ${{ steps.prepare.outputs.GROUP_ID }}
          PROFILE_ID: ${{ inputs.profile-id }}
          ARTIFACT_ID: ${{ steps.prepare.outputs.ARTIFACT_ID }}
          VERSION: ${{ steps.prepare.outputs.VERSION }}
          DOCS_PROJECT: ${{ inputs.docs-project }}
          SOURCE_GIT_SHA: ${{ inputs.source-git-sha || github.sha }}
          MAVEN_DEPLOY_USERNAME: ${{ secrets.MAVEN_DEPLOY_USERNAME }}
          MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}

      - name: Write completed-publication receipt
        if: ${{ !cancelled() && steps.publish-central.outputs.DEPLOYMENT_STATE == 'PUBLISHED' && inputs.docs-project != '' && steps.receipt.outputs.published-artifact-id == '' }}
        env:
          DOCS_PROJECT: ${{ inputs.docs-project }}
          GROUP_ID: ${{ steps.prepare.outputs.GROUP_ID }}
          ARTIFACT_ID: ${{ steps.prepare.outputs.ARTIFACT_ID }}
          VERSION: ${{ steps.prepare.outputs.VERSION }}
          SOURCE_GIT_SHA: ${{ inputs.source-git-sha || github.sha }}
          DEPLOYMENT_ID: ${{ steps.publish-central.outputs.DEPLOYMENT_ID }}
          DEPLOYMENT_STATE: ${{ steps.publish-central.outputs.DEPLOYMENT_STATE }}
        run: |
          shared-workflows/ci/maven-publish/write_maven_publication_receipt.sh completed-publication/publication.json

      - name: Retain completed-publication receipt
        if: ${{ !cancelled() && steps.publish-central.outputs.DEPLOYMENT_STATE == 'PUBLISHED' && inputs.docs-project != '' && steps.receipt.outputs.published-artifact-id == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-central-published-${{ inputs.docs-project }}
          path: completed-publication/publication.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain deployment for publication recovery
        if: ${{ !cancelled() && steps.destination.outputs.is_release == 'true' && steps.receipt.outputs.artifact-id == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-central-deployment-${{ inputs.artifact-name }}-${{ github.run_id }}
          path: deployment-receipt/deployment.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload to Sonatype snapshots
        id: publish-snapshot
        if: ${{ steps.destination.outputs.is_release == 'false' }}
        run: |
          shared-workflows/ci/maven-publish/maven_snapshot_publish.sh \
            --input signed-maven-repo \
            --group-id "${GROUP_ID}" \
            --artifact-id "${ARTIFACT_ID}" \
            --version "${VERSION}" \
            --output-bundle snapshot-bundle.zip
        env:
          GROUP_ID: ${{ steps.prepare.outputs.GROUP_ID }}
          ARTIFACT_ID: ${{ steps.prepare.outputs.ARTIFACT_ID }}
          VERSION: ${{ steps.prepare.outputs.VERSION }}
          MAVEN_DEPLOY_USERNAME: ${{ secrets.MAVEN_DEPLOY_USERNAME }}
          MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}

      - name: Retain signed Maven Central bundle
        if: ${{ !cancelled() && steps.destination.outputs.is_release == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-central-bundle-${{ steps.prepare.outputs.ARTIFACT_ID }}-${{ steps.prepare.outputs.VERSION }}-${{ inputs.source-git-sha }}
          path: central-bundle.zip
          if-no-files-found: ignore
          retention-days: 90

      - name: Retain signed Sonatype snapshot bundle
        if: ${{ !cancelled() && steps.destination.outputs.is_release == 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonatype-snapshot-bundle-${{ steps.prepare.outputs.ARTIFACT_ID }}-${{ steps.prepare.outputs.VERSION }}-${{ inputs.source-git-sha }}
          path: snapshot-bundle.zip
          if-no-files-found: ignore
          retention-days: 90
