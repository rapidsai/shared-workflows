name: Identify stopgap burndown PR

on:
  workflow_call:
    outputs:
      skip-product-ci:
        description: True only for a generated same-repository stopgap candidate PR
        value: ${{ jobs.classify.outputs.skip-product-ci }}

permissions: {}

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip-product-ci: ${{ steps.classify.outputs.skip_product_ci }}
    steps:
      - name: Read canonical PR metadata
        id: pr
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/pull-request/')
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main
      - name: Identify a generated burndown candidate
        id: classify
        env:
          PR_INFO: ${{ steps.pr.outputs.pr-info }}
          GH_TOKEN: ${{ github.token }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          # BEGIN BURNDOWN CLASSIFIER
          if ! jq -e --arg repository "$CALLER_REPOSITORY" '
            .state == "open" and .base.ref == "main" and
            .base.repo.full_name == $repository and .head.repo.full_name == $repository and
            (.head.ref | test("^version-update-[0-9]{2}\\.[0-9]{2}$")) and
            (.head.sha | test("^[0-9a-f]{40}$")) and
            ([.labels[].name] | index("non-breaking") != null and index("improvement") != null) and
            (.body |
              (contains("This PR updates the repository to version ") and
               test("This is part of the [0-9]{2}\\.[0-9]{2} release burndown process\\.")) or
              (contains("This PR reviews the atomic burndown candidate that updates main to version") and
               contains("The candidate history also contains the release-settings commit and its revert")))
          ' <<< "$PR_INFO" >/dev/null; then
            echo 'skip_product_ci=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_sha=$(jq -r '.head.sha' <<< "$PR_INFO")
          message=$(gh api "repos/$CALLER_REPOSITORY/git/commits/$head_sha" --jq .message)
          skip=$(jq -nr --arg message "$message" '
            ([$message | scan("(?m)^Burndown-Base: [0-9a-f]{40}$")] | length) == 1 and
            ([$message | scan("(?m)^Burndown-Release: [0-9a-f]{40}$")] | length) == 1
          ')
          echo "skip_product_ci=$skip" >> "$GITHUB_OUTPUT"
          # END BURNDOWN CLASSIFIER
