# Avoid warnings about unrecognized runner types.
self-hosted-runner:
  labels:
    - linux-amd64-*
    - linux-arm64-*

# Avoid warnings about referencing things in ${{ vars.* }} statements.
config-variables:
  - AWS_REGION
  - AWS_ROLE_ARN
  - MAVEN_DEPLOY_USERNAME
  - TELEMETRY_ENABLED

paths:
  .github/workflows/conda-python-tests.yaml:
    ignore:
      # ${{ secrets.CODECOV_TOKEN }} is valid if a secret like that exists in the calling repo,
      # and we're confident that it's there in our repos, so this error can be silenced
      - 'property "codecov_token" is not defined in object type'
  .github/workflows/maven-publish.yaml:
    ignore:
      # job.workflow_repository / job.workflow_sha are real GitHub Actions
      # context properties (used to self-checkout a reusable workflow's own
      # source). actionlint's type schema appears to be out of date.
      - 'property "workflow_repository" is not defined in object type'
      - 'property "workflow_sha" is not defined in object type'
