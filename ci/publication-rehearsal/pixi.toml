[workspace]
name = "rapids-dummy-publishing"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
pip = "26.2.*"
conda = "26.9.*"
conda-index = "==0.13.0"
maven = "3.9.*"
openjdk = "17.*"
oras = "==1.3.3"
gnupg = "*"
openssl = "*"
curl = "*"
jq = "*"
git = "*"
bash = ">=5.2,<6"

[pypi-dependencies]
anaconda-client = "==1.15.0"
requests = "==2.34.2"
tenacity = "==9.2.1"
rich = "==15.0.0"
click = "==8.5.0"
pyyaml = "==6.0.3"
packaging = "==26.3"

[tasks]
demo = "python demo.py"
